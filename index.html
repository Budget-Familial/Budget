/* ---------- clôture de mois ---------- */
function monthKeyFromLabel(lbl){
  var m = String(lbl||'').toLowerCase().match(/([a-zéûôî]+)\s+(\d{4})/);
  if(m){
    var i = MOIS_FR.indexOf(m[1]);
    if(i>-1) return m[2]+'-'+String(i+1).padStart(2,'0');
  }
  var d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
}
function nextMonthLabel(lbl){
  var k = monthKeyFromLabel(lbl).split('-');
  var y = +k[0], mo = +k[1]; /* mo = 1..12 */
  if(mo>=12){ mo=1; y++; } else { mo++; }
  var s2 = MOIS_FR[mo-1]+' '+y;
  return s2.charAt(0).toUpperCase()+s2.slice(1);
}
function nextKey(k){
  var p = String(k||'').split('-'), y = +p[0], m = +p[1];
  if(!y || !m){ return monthKeyFromLabel(nextMonthLabel(state.data.monthLabel)); }
  if(m>=12){ m=1; y++; } else { m++; }
  return y+'-'+String(m).padStart(2,'0');
}
function labelFromKey(k){
  var p = String(k).split('-'), s2 = MOIS_FR[(+p[1])-1]+' '+p[0];
  return s2.charAt(0).toUpperCase()+s2.slice(1);
}
/* Réel par poste d'un mois archivé (pour comparer avec le mois en cours). */
function reelParPosteArchive(m){
  var out = {}, S = (m && m.snapshot) || {};
  (S.lignes||[]).forEach(function(l){ if(l.type==='fixe') out[l.id] = +l.reel||0; });
  (S.achats||[]).forEach(function(a){ if(a.posteId) out[a.posteId] = (out[a.posteId]||0) + (+a.montant||0); });
  var cats = {}; (S.epargnes||[]).forEach(function(e){ cats[e.id] = catOf(e); });
  ['epargne','invest'].forEach(function(c){
    var l = (S.lignes||[]).find(function(x){ return x.type===c; });
    if(!l) return;
    var v = (S.versements||[]).filter(function(x){ return (cats[x.epId]||'epargne')===c; }).reduce(function(s,x){ return s+(+x.montant||0); },0);
    out[l.id] = v || (+l.reel||0);
  });
  return out;
}
/* Détail par catégorie d'un mois archivé, pour le fichier téléchargé */
function detailMoisHtml(m){
  var S = m.snapshot||{}, L = S.lignes||[], A = (S.achats||[]).slice(), reel = reelParPosteArchive(m), T = m.totals||{};
  if(!L.length) return '';
  function nat(a){
    if(a.nature==='besoin' || a.nature==='envie') return a.nature;
    var l = L.find(function(x){ return x.id===a.posteId; });
    return (l && l.dispensable) ? 'envie' : 'besoin';
  }
  var h = '';
  /* revenus */
  var R = S.revenus||[];
  if(R.length){
    var rb = 0, rr = 0;
    h += '<h3>💶 Revenus</h3><table><tr><th>Revenu</th><th class="n">Prévu</th><th class="n">Reçu</th></tr>';
    R.forEach(function(r){ rb += +r.budget||0; rr += +r.reel||0; h += '<tr><td>'+escHtml(r.label||'')+'</td><td class="n">'+eur(+r.budget||0)+'</td><td class="n">'+eur(+r.reel||0)+'</td></tr>'; });
    h += '<tr class="tot"><td>Total</td><td class="n">'+eur(rb)+'</td><td class="n">'+eur(rr)+'</td></tr></table>';
  }
  /* catégories : prévu / réel / écart */
  var G = [
    {t:'🏠 Dépenses fixes', f:function(l){ return l.type==='fixe'; }},
    {t:'🛒 Dépenses variables', f:function(l){ return l.type==='variable'; }},
    {t:'🐷 Épargne et investissement', f:function(l){ return l.type==='epargne' || l.type==='invest'; }}
  ];
  h += '<h3>📋 Par catégorie</h3><table><tr><th>Catégorie</th><th class="n">Prévu</th><th class="n">Réel</th><th class="n">Écart</th></tr>';
  G.forEach(function(g){
    var items = L.filter(g.f); if(!items.length) return;
    var tb = 0, tr = 0, lignes = '';
    items.forEach(function(l){
      var b = +l.budget||0, r = reel[l.id]||0; tb += b; tr += r;
      if(!b && !r) return;
      var ec = (l.type==='epargne' || l.type==='invest') ? r-b : b-r;
      lignes += '<tr><td>'+escHtml(l.label||'')+(l.dispensable?' <span class="env">envie</span>':'')+'</td><td class="n">'+eur(b)+'</td><td class="n">'+eur(r)+'</td><td class="n '+(ec>=-0.005?'ok':'ko')+'">'+(ec>=0?'+':'−')+eur(Math.abs(ec))+'</td></tr>';
    });
    h += '<tr class="grp"><td>'+g.t+'</td><td class="n">'+eur(tb)+'</td><td class="n">'+eur(tr)+'</td><td></td></tr>' + lignes;
  });
  var hp = A.filter(function(a){ return !a.posteId || !L.some(function(l){ return l.id===a.posteId; }); }).reduce(function(s2,a){ return s2+(+a.montant||0); },0);
  if(hp) h += '<tr><td>❓ Sans poste</td><td class="n">—</td><td class="n">'+eur(hp)+'</td><td></td></tr>';
  h += '</table>';
  /* besoins / envies / épargne (règle 50/30/20) */
  var rev = +T.revenus||0;
  if(rev>0){
    var bes = 0, env = 0, epa = 0;
    L.forEach(function(l){ if(l.type==='fixe'){ if(l.dispensable) env += reel[l.id]||0; else bes += reel[l.id]||0; } else if(l.type==='epargne' || l.type==='invest') epa += reel[l.id]||0; });

/* Bilan d'un mois archivé, recalculé à partir de ce qui a été enregistré à la
   clôture (sert pour les mois clos avant l'arrivée du bilan automatique). */
function bilanFromArchive(m){
  var T = m.totals||{}, S = m.snapshot||{}, out = [];

  var dd = depP-dep;
  out.push({ic: dd>=0?'✅':'⚠️', txt:'Dépenses : <b>'+eur(dep)+'</b> pour '+eur0(depP)+' prévus — '+(dd>=0? eur(dd)+' de moins que prévu.' : eur(-dd)+' de plus que prévu.')});
  var reel = reelParPosteArchive(m);
  var over = (S.lignes||[]).filter(function(l){ return l.type!=='epargne' && l.type!=='invest' && (+l.budget||0)>0 && (reel[l.id]||0) > (+l.budget)+0.5; })
    .map(function(l){ return {l:l, ex:(reel[l.id]||0)-(+l.budget)}; }).sort(function(a,b){ return b.ex-a.ex; });
  if(over.length) out.push({ic:'🔴', txt:'Poste'+(over.length>1?'s':'')+' en dépassement : '+over.slice(0,4).map(function(o){ return '<b>'+escHtml(o.l.label)+'</b> (+'+eur(o.ex)+')'; }).join(', ')+'.'});
  else if(dep>0) out.push({ic:'👏', txt:'Aucun poste ne dépasse son budget.'});
  var hp = (S.achats||[]).filter(function(a){ return !a.posteId || !(S.lignes||[]).some(function(l){ return l.id===a.posteId && l.type==='variable'; }); })
    .reduce(function(s2,a){ return s2+(+a.montant||0); },0);
  if(hp>0) out.push({ic:'❓', txt:'Dont '+eur(hp)+' de dépenses sans poste.'});
  var epV = +T.epargneVerse||0, epL = (S.lignes||[]).find(function(l){ return l.type==='epargne'; }), epB = epL ? (+epL.budget||0) : 0;
  if(rev>0) out.push({ic: epB>0 && epV>=epB ? '✅':'💰', txt:'Épargne : <b>'+eur(epV)+'</b> mis de côté, soit '+Math.round(epV/rev*100)+' % des revenus'+(epB>0?' (objectif '+eur0(epB)+(epV>=epB?', atteint).':', '+eur(epB-epV)+' manquants).'):'.')});
  if(+T.investVerse>0) out.push({ic:'📈', txt:'Investissement : <b>'+eur(+T.investVerse)+'</b> investis ce mois.'});
  if(T.epargneTotal!=null) out.push({ic:'🐷', txt:'Placements : '+eur(T.epargneTotal)+' au total en fin de mois.'});
  var prev = state.history.filter(function(x){ return String(x.id) < String(m.id); }).sort(function(a,b){ return String(b.id).localeCompare(String(a.id)); })[0];
  if(prev && prev.totals){ var d2 = dep-(+prev.totals.depenses||0); out.push({ic: d2<=0?'📉':'📈', txt:'Par rapport à '+escHtml(prev.label||prev.id)+' : dépenses '+(d2<=0?'en baisse de ':'en hausse de ')+'<b>'+eur(Math.abs(d2))+'</b>.'}); }
  var rc = S.report ? (+S.report.compte||0) : null;
  if(T.soldeCompte!=null) out.push({ic:'🏦', txt:'Compte chèque'+(rc!=null?' : '+eur(rc)+' au début du mois →':' en fin de mois :')+' <b>'+eur(+T.soldeCompte)+'</b>.'});
  return out;
}

/* ================= EXPORT PDF =================
   Le PDF est fabriqué dans le navigateur (bibliothèques jsPDF + AutoTable,
   chargées seulement au premier export). Les polices standard des PDF ne
   connaissent pas les émojis ni certains signes : on les nettoie. */
var PDF_LIBS = ['https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js',
                'https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js'];
var pdfLibsPromise = null;
function chargerPdfLibs(){
  if(window.jspdf && window.jspdf.jsPDF && window.jspdf.jsPDF.API.autoTable) return Promise.resolve();
  if(pdfLibsPromise) return pdfLibsPromise;
  pdfLibsPromise = PDF_LIBS.reduce(function(p, src){
    return p.then(function(){ return new Promise(function(ok, ko){
      var sc = document.createElement('script'); sc.src = src; sc.onload = ok; sc.onerror = function(){ ko(new Error('pdf-lib')); };
      document.head.appendChild(sc);
    }); });
  }, Promise.resolve()).catch(function(e){ pdfLibsPromise = null; throw e; });
  return pdfLibsPromise;
}
var PDF_OK = '€‚ƒ„…†‡ˆ‰Š‹ŒŽ‘’“”•–—˜™š›œžŸ';
function pdfTxt(t){
  t = String(t==null?'':t).replace(/<[^>]*>/g,'')
    .replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'")
    .replace(/[   ]/g,' ').replace(/−/g,'-').replace(/≤/g,'max').replace(/≥/g,'min').replace(/[→➜]/g,'->');
  var out = '';
  for(var i=0;i<t.length;i++){ var c = t[i], code = t.charCodeAt(i); if(code<=0xFF || PDF_OK.indexOf(c)>-1) out += c; }
  return out.replace(/\s{2,}/g,' ').replace(/\(\s+/g,'(').trim();
}
/* Les chiffres d'un mois archivé, prêts à mettre en page */
function donneesMois(m){
  var S = m.snapshot||{}, L = S.lignes||[], A = (S.achats||[]).slice(), reel = reelParPosteArchive(m), T = m.totals||{};
  function posteDe(a){ return L.find(function(x){ return x.id===a.posteId; }); }
  function nat(a){ if(a.nature==='besoin' || a.nature==='envie') return a.nature; var l = posteDe(a); return (l && l.dispensable) ? 'envie' : 'besoin'; }
  var D = {label: m.label||m.id, T: T, revenus: (S.revenus||[]).map(function(r){ return {label:r.label, b:+r.budget||0, r:+r.reel||0}; }), groupes: [], ratio: null, details: []};
  [['Dépenses fixes', function(l){ return l.type==='fixe'; }], ['Dépenses variables', function(l){ return l.type==='variable'; }], ['Épargne et investissement', function(l){ return l.type==='epargne' || l.type==='invest'; }]]
  .forEach(function(g){
    var items = L.filter(g[1]); if(!items.length) return;
    var G = {t:g[0], b:0, r:0, items:[]};
    items.forEach(function(l){
      var b = +l.budget||0, r = reel[l.id]||0; G.b += b; G.r += r;
      if(!b && !r) return;
      var ep = (l.type==='epargne' || l.type==='invest');
      G.items.push({label:l.label, envie:!!l.dispensable, b:b, r:r, ec: ep ? r-b : b-r});
    });
    D.groupes.push(G);
  });
  var rev = +T.revenus||0;
  if(rev>0){
    var bes = 0, env = 0, epa = 0;
    L.forEach(function(l){ if(l.type==='fixe'){ if(l.dispensable) env += reel[l.id]||0; else bes += reel[l.id]||0; } else if(l.type==='epargne' || l.type==='invest') epa += reel[l.id]||0; });
    A.forEach(function(a){ var l = posteDe(a); if(l && l.type==='fixe') return; if(nat(a)==='envie') env += +a.montant||0; else bes += +a.montant||0; });
    D.ratio = {rev:rev, bes:bes, env:env, epa:epa};
  }
  var ordre = L.filter(function(l){ return A.some(function(a){ return a.posteId===l.id; }); });
  D.details = ordre.map(function(l){ return {lbl:l.label, list:A.filter(function(a){ return a.posteId===l.id; })}; });
  var orph = A.filter(function(a){ return !posteDe(a); });
  if(orph.length) D.details.push({lbl:'Sans poste', list:orph});
  D.details.forEach(function(g){
    g.list.sort(function(a,b){ return String(a.date||'').localeCompare(String(b.date||'')); });
    g.tot = g.list.reduce(function(s2,a){ return s2+(+a.montant||0); },0);
  });
  return D;
}

    if(D.ratio){

      function lig(lbl, v, ok, cible){ return [lbl, e(v), {content:Math.round(v/R.rev*100)+' %', styles:{textColor: ok ? VERT : ROUGE, fontStyle:'bold'}}, cible]; }
      titre('Besoins, envies, épargne (règle 50/30/20)');
      table(['','Montant','% revenus','Cible'], [
        lig('Besoins', R.bes, R.bes/R.rev<=0.5, 'max 50 %'), lig('Envies', R.env, R.env/R.rev<=0.3, 'max 30 %'), lig('Épargne', R.epa, R.epa/R.rev>=0.2, 'min 20 %')
      ], {1:NUM, 2:{halign:'right', cellWidth:70}, 3:{halign:'right', cellWidth:70}});
    }
  });
  var n = doc.getNumberOfPages();
  for(var i=1;i<=n;i++){ doc.setPage(i); doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(150); doc.text(i+' / '+n, W-M, H-20, {align:'right'}); }
  return doc.output('arraybuffer');
}
function telechargerPdf(mois, nom, btn){
  if(!state.dl){ toast('Le téléchargement n\'est pas disponible ici.', 'bad'); return; }
  if(btn){ btn.disabled = true; btn.dataset.lbl = btn.textContent; btn.textContent = '⏳ Préparation…'; }
  function fin(){ if(btn){ btn.disabled = false; btn.textContent = btn.dataset.lbl; } }
  chargerPdfLibs().then(function(){
    return state.dl.save({filename: nom, data: bilanPdf(mois)});
  }).then(function(r){
    fin(); if(r && r.status==='saved') toast('✅ PDF enregistré', 'good');
  }).catch(function(err){
    fin();
    var c = err && err.code;
    if(c==='declined') return;
    if(c==='rate_limited'){ toast('Un téléchargement est déjà en cours.', 'warn'); return; }
    if(err && err.message==='pdf-lib'){ toast('Impossible de préparer le PDF (connexion ?). Réessayez.', 'bad'); return; }
    console.error('pdf', err);
    toast('Téléchargement du PDF impossible ici.', 'bad');
  });
}

function doCloseMonth(){
  var d = state.data, t = totals(), et = epTotals();
  var key = d.moisCle || monthKeyFromLabel(d.monthLabel);
  var archive = {
    id: key,
    label: d.monthLabel,
    closedAt: new Date().toISOString(),
    totals: {
      revenus: t.revR, revenusPrevu: t.revB,
      depenses: t.depR, depensesPrevu: t.depB,
      fixes: t.fixeR, variables: t.varR, fixesDispensables: t.fixeDispR,
      carte: t.carteR, especes: t.cashR,
      soldeCompte: t.soldeCompte, soldeEspeces: t.soldeCash,
      epargneTotal: et.hasTotal ? et.total : null,
      sorties: t.sortiesR,
      epargneVerse: epTotals('epargne').verse, investVerse: epTotals('invest').verse, epargneGain: et.hasGain ? et.gain : null
    },
    bilan: bilanLignes(),
    snapshot: { revenus: d.revenus, lignes: d.lignes, epargnes: stripVersements(d.epargnes), achats: deps.docs, versements: vers.docs, transferts: trans.docs, report: d.report }
  };
  state.db.collection('mois').doc(key).set(archive).then(function(){
    d.report = { compte: Math.round(t.soldeCompte*100)/100, especes: Math.round(t.soldeCash*100)/100 };
    d.revenus.forEach(function(r){ r.reel = 0; r.recu = false; });
    d.lignes.forEach(function(l){ l.reel = 0; if(l.type==='fixe') l.paye = false; });
    var moisClos = d.moisCle;
    d.epargnes.forEach(function(e){
      var v = epFin(e), inv = catOf(e)==='invest' ? investTotal(e) : epInvesti(e);
      e.histo = (e.histo||[]).filter(function(p){ return p.mois!==moisClos; });
      e.histo.push({mois: moisClos, valeur: v==null?null:Math.round(v*100)/100, investi: inv==null?null:Math.round(inv*100)/100});
      if(inv!=null) e.investi = Math.round(inv*100)/100;
      e.debut = (v==null) ? e.debut : Math.round(v*100)/100;
      e.finOverride = null; e.verseAuMoment = 0;
    });
    /* nouveau mois : les dépenses et versements du mois clos restent en base,
       rangés sous leur mois ; la page affiche ceux du mois suivant (vides). */
    var nk = nextKey(d.moisCle);
    var plan = d.prochain && d.prochain[nk];
    if(plan){
      d.lignes.forEach(function(l){ if(plan.lignes && isSet(plan.lignes[l.id])) l.budget = +plan.lignes[l.id]; });
      d.revenus.forEach(function(r){ if(plan.revenus && isSet(plan.revenus[r.id])) r.budget = +plan.revenus[r.id]; });
    }
    d.moisCle = nk;
    d.monthLabel = labelFromKey(nk);
    state.confirmClose = false;
    persist(true, ['report','revenus','lignes','epargnes','monthLabel','moisCle']);
    state.justClosed = key;
    toast('📦 '+escHtml(archive.label)+' clôturé — téléchargez son bilan en PDF dans l\'onglet Bilan.', 'good');
    ensureMonthSubscriptions();
    attachDerived();
    render();
  }).catch(function(err){
    console.error('cloture', err);
    var p = document.querySelector('.close-panel');
    if(p) p.insertAdjacentHTML('beforeend','<p class="hint-line" style="color:var(--critical);">L\'archivage a échoué, rien n\'a été modifié. Réessayez.</p>');
  });
}

/* Redessine tout en gardant le curseur dans le champ en cours de saisie. */
function rerenderKeepFocus(){
  var a = document.activeElement, key = null, selStart = null, selEnd = null;
  if(a && a.attributes){
    for(var i=0;i<a.attributes.length;i++){
      var at = a.attributes[i];
      if(at.name==='id' || /^data-/.test(at.name)){ key = '['+at.name+'="'+at.value+'"]'; if(at.name==='id') key = '#'+at.value; break; }
    }
    try{ selStart = a.selectionStart; selEnd = a.selectionEnd; }catch(e){}
  }
  var raw = (a && 'value' in a) ? a.value : null;
  render();
  if(key){
    var el = document.querySelector(key);
    if(el){ if(raw!=null && el.tagName==='INPUT') el.value = raw; el.focus(); try{ if(selStart!=null) el.setSelectionRange(selStart, selEnd); }catch(e){} }
  }
}

    el.onchange = function(){
      var l = findItem('lignes', el.getAttribute('data-paye'));
      if(!l) return;
      l.paye = el.checked;
      l.reel = el.checked ? ((+l.reel||0)>0 ? +l.reel : (+l.budget||0)) : 0;
      l.autoCoche = false;
      if(isSet(l.jour)) l.autoMois = state.data.moisCle;   /* choix manuel : l'appli ne recoche plus ce mois-ci */

        return;
      }
      if(key.indexOf('v:')===0){ vers.remove(key.slice(2)); render(); return; }
      if(key.indexOf('a:')===0){
        var part = deps.find(key.slice(2));
        var root = part && part.splitOf && deps.find(part.splitOf);
        if(root) deps.edit(root.id, 'montant', Math.round(((+root.montant||0) + (+part.montant||0))*100)/100, true);
        deps.remove(key.slice(2)); render(); return;
      }
      if(key.indexOf('tr:')===0){ trans.remove(key.slice(3)); render(); return; }
      var parts = key.split(':'), listName = parts[0]==='r' ? 'revenus' : (parts[0]==='e' ? 'epargnes' : 'lignes');
      var before = state.data[listName].length;
      state.data[listName] = state.data[listName].filter(function(x){ return x.id!==parts[1]; });
      if(state.data[listName].length===before) return; /* rien à supprimer */
      if(listName==='epargnes'){
        /* les versements de ce placement partent avec lui */
        vers.docs.filter(function(v){ return v.epId===parts[1]; }).forEach(function(v){ vers.remove(v.id); });
      }
      if(listName==='lignes') state.posteOrder = null;
      persist(true, [listName]); render();
    };
  });
}

/* Tri stable : chaque ligne garde son rang d'origine en cas d'égalité, et le
   nom sert toujours de départage — sinon l'ordre pouvait changer d'un affichage
   à l'autre pour des montants identiques. */
function sortRows(rows){
  var idx = {};
  rows.forEach(function(l,i){ idx[l.id] = i; });
  var byName = function(a,b){ return cleanName(a.label).localeCompare(cleanName(b.label),'fr',{sensitivity:'base', numeric:true}); };
  var tie = function(a,b){ return byName(a,b) || (idx[a.id]-idx[b.id]); };
  var r = rows.slice();
  var m = state.sortMode;
  if(m==='reel') r.sort(function(a,b){ return (reelOf(b)-reelOf(a)) || tie(a,b); });
  else if(m==='budget') r.sort(function(a,b){ return ((+b.budget||0)-(+a.budget||0)) || tie(a,b); });
  else if(m==='reste') r.sort(function(a,b){ return (((+a.budget||0)-reelOf(a)) - ((+b.budget||0)-reelOf(b))) || tie(a,b); });
  else if(m==='nom') r.sort(function(a,b){ return byName(a,b) || (idx[a.id]-idx[b.id]); });
  else if(m==='type'){
    var rank = {fixe:0, variable:1, epargne:2, invest:3};
    r.sort(function(a,b){
      var ra = (rank[a.type]==null?1:rank[a.type]) + (a.dispensable?0.5:0), rb = (rank[b.type]==null?1:rank[b.type]) + (b.dispensable?0.5:0);
      return (ra-rb) || ((+b.budget||0)-(+a.budget||0)) || tie(a,b);
    });
  }
  return r;
}
function cleanName(s){ return String(s||'').replace(/^[^A-Za-zÀ-ÿ0-9]+/,'').trim(); }
function escHtml(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function renderPareto(){
  drawPareto(state.paretoMode==='reel' ? 'reel' : 'budget', 'paretoBox', 'paretoNote');
}

/* Diagramme de Pareto dessiné en SVG (aucune bibliothèque externe) :
   barres = part de chaque dépense dans le total, ligne = cumul, pointillé = 80 %. */
function drawPareto(field, boxId, noteId){
  var box = document.getElementById(boxId), note = document.getElementById(noteId);
  if(!box) return;
  var entries = state.data.lignes
    .map(function(l){ return {label:l.label||'(sans nom)', val: field==='reel' ? reelOf(l) : (+l.budget||0), type:l.type}; })
    .filter(function(e){ return e.val>0; });
  if(field==='reel'){
    var hp = achatsHorsPoste().reduce(function(s,a){ return s+(+a.montant||0); },0);
    if(hp>0) entries.push({label:'❓ Hors poste', val:hp, type:'variable'});
  }
  entries.sort(function(a,b){ return b.val-a.val; });

  if(!entries.length){
    box.innerHTML = '<div class="empty" style="padding:28px;"><div class="em">📭</div><p>'+(field==='reel'?'Aucune dépense réelle saisie pour le moment.':'Aucun montant prévisionnel saisi.')+'</p></div>';
    if(note) note.textContent = '';
    return;
  }

  var total = entries.reduce(function(s,e){ return s+e.val; },0);
  var cum=0, n80=0, reached=false;
  entries.forEach(function(e){
    e.share = e.val/total;
    cum += e.val; e.cum = cum/total;
    if(!reached){ n80++; if(e.cum>=0.7999) reached=true; }
  });

  var n = entries.length;
  var padL = 44, padR = 16, padT = 16, padB = 96;
  var avail = (box.clientWidth || 600) - padL - padR;
  var plotW = Math.max(n*34, avail);
  var W = padL+plotW+padR, H = 330;
  var plotH = H-padT-padB;
  var step = plotW/n, barW = Math.min(30, step*0.62);
  function y(p){ return padT + plotH*(1-p); }

  var svg = '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="Diagramme de Pareto '+(field==='reel'?'réel':'prévisionnel')+'" style="display:block; max-width:none;">';
  /* grille + axe */
  [0,0.2,0.4,0.6,0.8,1].forEach(function(p){
    svg += '<line x1="'+padL+'" x2="'+(padL+plotW)+'" y1="'+y(p)+'" y2="'+y(p)+'" stroke="var(--line)" stroke-width="1"/>';
    svg += '<text x="'+(padL-6)+'" y="'+(y(p)+4)+'" text-anchor="end" font-size="10.5" fill="var(--ink-muted)">'+Math.round(p*100)+'%</text>';
  });
  /* ligne 80 % */
  svg += '<line x1="'+padL+'" x2="'+(padL+plotW)+'" y1="'+y(0.8)+'" y2="'+y(0.8)+'" stroke="var(--critical)" stroke-width="1.2" stroke-dasharray="5 4"/>';
  svg += '<text x="'+(padL+plotW-2)+'" y="'+(y(0.8)-5)+'" text-anchor="end" font-size="10.5" font-weight="700" fill="var(--critical)">80 %</text>';
  /* zone 80 % en fond */
  svg += '<rect x="'+padL+'" y="'+padT+'" width="'+(step*n80)+'" height="'+plotH+'" fill="var(--accent)" opacity="0.06"/>';

  /* barres */
  entries.forEach(function(e,i){
    var cx = padL + step*i + step/2;
    var top = y(e.share);
    var col = e.type==='fixe' ? 'var(--fixe)' : (e.type==='epargne' ? 'var(--k-lep)' : (e.type==='invest' ? 'var(--k-bourse)' : 'var(--variable)'));
    svg += '<g><title>'+escHtml(e.label)+' : '+eur(e.val)+' ('+(Math.round(e.share*1000)/10)+' %) — cumul '+(Math.round(e.cum*1000)/10)+' %</title>';
    svg += '<rect x="'+(cx-barW/2)+'" y="'+top+'" width="'+barW+'" height="'+Math.max(1,(padT+plotH)-top)+'" rx="3" fill="'+col+'"/>';
    if(e.share>=0.04) svg += '<text x="'+cx+'" y="'+(top-4)+'" text-anchor="middle" font-size="10" font-weight="700" fill="var(--ink-2)">'+Math.round(e.share*100)+'%</text>';
    svg += '</g>';
    var lbl = e.label.length>18 ? e.label.slice(0,17)+'…' : e.label;
    svg += '<text transform="translate('+(cx+3)+','+(padT+plotH+12)+') rotate(-40)" text-anchor="end" font-size="10.5" fill="var(--ink-2)">'+escHtml(lbl)+'</text>';
  });

  /* courbe de cumul */
  var pts = entries.map(function(e,i){ return (padL+step*i+step/2)+','+y(e.cum); }).join(' ');
  svg += '<polyline points="'+pts+'" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>';
  entries.forEach(function(e,i){
    svg += '<circle cx="'+(padL+step*i+step/2)+'" cy="'+y(e.cum)+'" r="3.2" fill="var(--card)" stroke="var(--ink)" stroke-width="1.6"><title>Cumul : '+(Math.round(e.cum*1000)/10)+' %</title></circle>';
  });
  svg += '</svg>';

  var legend = '<div class="pareto-legend"><span><i style="background:var(--fixe)"></i>Fixe</span><span><i style="background:var(--variable)"></i>Variable</span><span><i style="background:var(--k-lep)"></i>Épargne</span><span><i style="background:var(--k-bourse)"></i>Investissement</span><span><i class="ln"></i>Cumul</span><span><i class="dash"></i>Seuil 80 %</span></div>';
  box.innerHTML = legend + '<div class="pareto-scroll">'+svg+'</div>';

  if(note){
    var top = entries.slice(0,n80);
    var topSum = top.reduce(function(s,e){return s+e.val;},0);
    var nFixeTop = top.filter(function(e){return e.type==='fixe';}).length;
    var txt = '<strong>'+n80+' dépense'+(n80>1?'s':'')+' sur '+n+'</strong> représente'+(n80>1?'nt':'')+' '+Math.round(topSum/total*100)+' % du total '+(field==='reel'?'réel':'prévu')+' ('+eur(topSum)+' sur '+eur(total)+') : '+top.map(function(e){return escHtml(e.label);}).join(', ')+'.';
    if(nFixeTop===top.length) txt += ' Ce sont uniquement des dépenses fixes : les économies passent par une renégociation (contrat, assurance, abonnement) plutôt que par le quotidien.';
    else if(nFixeTop===0) txt += ' Ce sont uniquement des dépenses variables : c\'est sur elles que vos habitudes du mois ont le plus d\'effet.';
    note.innerHTML = txt;
  }
}

var resizeTimer=null;
window.addEventListener('resize', function(){ if(!state.exists) return; clearTimeout(resizeTimer); resizeTimer=setTimeout(renderPareto, 200); });

try{
  var savedTab = localStorage.getItem('bc_tab'); if(savedTab==='saisie'||savedTab==='bilan'||savedTab==='budget') state.tab = savedTab;

  var savedSort = localStorage.getItem('bc_sort'); if(savedSort) state.sortMode = savedSort;
  state.soldeDetOpen = localStorage.getItem('bc_det')==='1';
}catch(e){}

window.__startApp = initDb;
