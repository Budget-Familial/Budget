<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Budget</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="theme-color" content="#e3f4ee">
<style>
  :root{
    color-scheme: light;
    /* Un seul thème, clair et frais : dégradé menthe → ciel → pêche derrière des cartes blanches. */
    --page: #e3f4ee;
    --page-grad: radial-gradient(120% 60% at 0% 0%, #b9e8d6 0%, rgba(185,232,214,0) 62%),
                 radial-gradient(90% 55% at 100% 18%, #c9dcfa 0%, rgba(201,220,250,0) 64%),
                 radial-gradient(110% 60% at 50% 100%, #fad6c0 0%, rgba(250,214,192,0) 62%),
                 linear-gradient(180deg, #ddf2ea 0%, #e9f0fb 50%, #f8e9df 100%);
    --shadow: 0 1px 2px rgba(23,62,74,0.05), 0 6px 22px rgba(23,62,74,0.07);
    --surface: #fcfcfb;
    --card: #ffffff;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --ink-muted: #898781;
    --line: #e1e0d9;
    --border: rgba(11,11,11,0.10);
    --accent: #2a78d6;
    --accent-ink: #ffffff;
    --fixe: #2a78d6;
    --fixe-bg: #e8f0fb;
    --variable: #eb6834;
    --variable-bg: #fdece2;
    --good: #0ca30c;
    --good-bg: #e8f8e8;
    --warning: #b9790a;
    --warning-bg: #fdf0da;
    --critical: #d03b3b;
    --critical-bg: #fbe8e8;
  }
  *{box-sizing:border-box;}
  body::before{content:''; position:fixed; inset:0; z-index:-1; background:var(--page-grad); pointer-events:none;}
  body{margin:0; background:var(--page); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; font-size:14px; -webkit-font-smoothing:antialiased;}
  #app{max-width:980px; margin:0 auto; padding:20px 16px 60px;}
  h1,h2,h3{margin:0; font-weight:700;}
  .hero{display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:18px;}
  .hero h1{font-size:22px; letter-spacing:-0.01em;}
  .hero .sub{color:var(--ink-2); font-size:13px; margin-top:2px;}
  .month-edit{border:none; background:transparent; color:var(--ink); font-size:22px; font-weight:700; font-family:inherit; letter-spacing:-0.01em; border-bottom:2px dashed transparent; padding:0; min-width:60px;}
  .month-edit:hover, .month-edit:focus{border-bottom-color:var(--accent); outline:none;}
  .card{background:var(--card); border:1px solid rgba(255,255,255,0.7); border-radius:16px; padding:16px 18px; margin-bottom:16px; box-shadow:var(--shadow);}
  .card h3{font-size:14px; margin-bottom:12px; display:flex; align-items:center; gap:8px;}
  .grid{display:grid; gap:12px;}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); margin-bottom:16px;}
  .kpi{background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 16px; position:relative; overflow:hidden;}
  .kpi::before{content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--kpi-accent, var(--accent));}
  .kpi .lbl{font-size:12px; color:var(--ink-2); font-weight:600; margin-bottom:4px;}
  .kpi .val{font-size:22px; font-weight:800; letter-spacing:-0.02em; font-variant-numeric:tabular-nums;}
  .kpi .sub{font-size:11.5px; color:var(--ink-muted); margin-top:3px;}
  .badge{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; padding:2px 7px; border-radius:100px; margin-top:5px;}
  .badge.good{background:var(--good-bg); color:var(--good);}
  .badge.bad{background:var(--critical-bg); color:var(--critical);}

  .progress-wrap{margin-top:6px;}
  .progress-bar{height:10px; border-radius:100px; background:var(--line); overflow:hidden; position:relative;}
  .progress-fill{height:100%; border-radius:100px; transition:width .25s ease;}
  .progress-label{display:flex; justify-content:space-between; font-size:11.5px; color:var(--ink-2); margin-top:5px;}

  .revenu-row{display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  .field{display:flex; flex-direction:column; gap:3px;}
  .field label{font-size:11px; color:var(--ink-muted); font-weight:600; text-transform:uppercase; letter-spacing:.03em;}
  .num-input{border:1px solid var(--border); background:var(--surface); color:var(--ink); border-radius:8px; padding:7px 9px; font-size:14px; font-family:inherit; font-variant-numeric:tabular-nums; width:110px;}
  .num-input:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:transparent;}
  .text-input{border:1px solid var(--border); background:var(--surface); color:var(--ink); border-radius:8px; padding:7px 9px; font-size:14px; font-family:inherit; width:100%;}
  .text-input:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:transparent;}
  .ecart-tag{font-weight:700; font-variant-numeric:tabular-nums; font-size:13px;}
  .ecart-tag.good{color:var(--good);}
  .ecart-tag.bad{color:var(--critical);}

  .filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;}
  .pill{border:1px solid var(--border); background:var(--surface); color:var(--ink-2); border-radius:100px; padding:6px 13px; font-size:12.5px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:6px;}
  .pill.active{background:var(--accent); color:var(--accent-ink); border-color:transparent;}
  .pill .dot{width:8px; height:8px; border-radius:50%;}
  .sort-btn{margin-left:auto; border:1px solid var(--border); background:var(--surface); color:var(--ink-2); border-radius:100px; padding:6px 13px; font-size:12.5px; font-weight:600; cursor:pointer;}

  .count{color:var(--ink-muted); font-weight:600;}
  :root{ --k-livreta:#2a78d6; --k-lep:#1baf7a; --k-bourse:#4a3aa7; --k-crypto:#eda100; --k-autre:#898781; }
  .ep-stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:10px; margin-bottom:14px;}
  .ep-stat{background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:10px 12px;}
  .ep-stat .lbl{font-size:11.5px; color:var(--ink-2); font-weight:600;}
  .ep-stat .val{font-size:18px; font-weight:800; font-variant-numeric:tabular-nums; margin-top:2px;}
  .ep-bar{display:flex; height:14px; border-radius:100px; overflow:hidden; background:var(--line); margin-bottom:6px;}
  .ep-bar span{display:block; height:100%;}
  .ep-legend{display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--ink-2); margin-bottom:14px;}
  .ep-legend i{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:-1px;}
  .kind-livretA{color:var(--k-livreta);} .kind-lep{color:var(--k-lep);} .kind-bourse{color:var(--k-bourse);} .kind-crypto{color:var(--k-crypto);} .kind-autre{color:var(--ink-2);}
  .num-input[readonly]{background:var(--line); color:var(--ink-2); cursor:not-allowed;}
  .hero-actions{display:flex; gap:8px; flex-wrap:wrap;}
  .btn-ghost{background:var(--surface); color:var(--ink-2); border:1px solid var(--border);}
  .btn-ghost:hover{border-color:var(--accent); color:var(--accent);}
  .close-panel{border:1px solid var(--accent); background:var(--card); border-radius:14px; padding:16px 18px; margin-bottom:16px;}
  .close-panel h3{font-size:14px; margin-bottom:8px;}
  .close-panel ul{margin:8px 0 12px; padding-left:20px; font-size:13px; color:var(--ink-2); line-height:1.7;}
  .close-panel .actions{display:flex; gap:8px; flex-wrap:wrap;}
  .hist-bar{display:flex; align-items:flex-end; gap:6px; height:90px; margin:6px 0 12px;}
  .hist-bar .hb{flex:1; min-width:14px; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:4px;}
  .hist-bar .hb i{display:block; width:100%; background:var(--fixe); border-radius:4px 4px 0 0;}
  .hist-bar .hb em{font-size:9.5px; color:var(--ink-muted); font-style:normal; white-space:nowrap;}
  .quick-add{display:flex; gap:8px; flex-wrap:wrap; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:10px 12px;}
  .quick-add .qa-label{flex:1 1 180px; min-width:140px;}
  .quick-add .qa-date{flex:0 0 140px; width:140px;}
  .quick-add .qa-amount{flex:0 0 110px;}
  .quick-add .btn{flex:0 0 auto;}
  .date-input{width:130px; font-size:12.5px;}
  .field-error{outline:2px solid var(--critical); outline-offset:1px;}
  .chip-warn{color:var(--warning); background:var(--warning-bg); border-color:transparent;}
  .reel-auto{display:inline-flex; flex-direction:column; align-items:flex-end; font-weight:700; font-variant-numeric:tabular-nums;}
  .reel-auto em{font-style:normal; font-weight:600; font-size:10.5px; color:var(--ink-muted);}
  .mini-bar{width:70px; height:8px; border-radius:100px; background:var(--line); overflow:hidden;}
  .mini-bar i{display:block; height:100%; border-radius:100px;}
  .tabbar{position:fixed; left:0; right:0; bottom:0; z-index:20; display:flex; gap:4px; justify-content:center;
    background:rgba(255,255,255,0.86); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); border-top:1px solid var(--border); padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));}
  .tab-btn{flex:1 1 0; max-width:220px; border:none; background:transparent; color:var(--ink-muted); font-family:inherit; font-size:11.5px; font-weight:700;
    display:flex; flex-direction:column; align-items:center; gap:2px; padding:7px 4px; border-radius:12px; cursor:pointer;}
  .tab-btn .ic{font-size:19px; line-height:1;}
  .tab-btn.active{color:var(--accent); background:var(--fixe-bg);}
  #app{padding-bottom:96px;}
  .sorties-card{display:flex; flex-direction:column; gap:2px;}
  .sorties-row{display:flex; justify-content:space-between; align-items:baseline; font-size:13px; font-weight:600; color:var(--ink-2);}
  .sorties-row b{font-size:20px; font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums;}
  .sorties-detail{font-size:12px; color:var(--ink-muted);}
  .solde-card{padding:18px 18px 12px;}
  .solde-top{display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:wrap;}
  .solde-lbl{font-size:12.5px; font-weight:700; color:var(--ink-2);}
  .solde-val{font-size:34px; font-weight:800; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; line-height:1.15;}
  .solde-cash{text-align:right;}
  .solde-val2{font-size:19px; font-weight:800; font-variant-numeric:tabular-nums;}
  .solde-proj{margin-top:12px; padding-top:10px; border-top:1px solid var(--line); display:grid; gap:4px; font-size:13px; color:var(--ink-2);}
  .solde-proj > div{display:flex; justify-content:space-between; font-variant-numeric:tabular-nums;}
  .solde-proj b{color:var(--ink);} .solde-proj b.pos{color:var(--good);}
  .solde-proj .fin{font-weight:700; color:var(--ink); margin-top:2px;}
  .solde-proj .fin b{font-size:15px;}
  .solde-det{margin-top:10px; font-size:13px;}
  .proj-line{margin-top:6px; font-size:12.5px; color:var(--ink-2); line-height:1.45;}
  .proj-line b{font-size:14px;} .proj-line span{color:var(--ink-muted);}
  .reste-bloc{margin-top:14px; padding-top:12px; border-top:1px solid var(--line);}
  .solde-actions{margin-top:8px; padding-top:2px; border-top:1px solid var(--line);}
  .solde-actions .solde-det{margin-top:4px;}
  details.sec{border-top:1px solid var(--line); padding:10px 0 2px;}
  .card > details.sec:first-child{border-top:0; padding-top:0;}
  details.sec > summary{list-style:none; cursor:pointer; display:flex; align-items:center; gap:8px; font-weight:700; font-size:15px; color:var(--ink); padding:2px 0 8px;}
  details.sec > summary::-webkit-details-marker{display:none;}
  details.sec > summary::after{content:'›'; font-size:20px; line-height:1; color:var(--ink-muted); transform:rotate(90deg); transition:transform .15s;}
  details.sec[open] > summary::after{transform:rotate(-90deg);}
  .sec-count{font-size:11.5px; font-weight:700; color:var(--ink-muted); background:var(--line); border-radius:100px; padding:1px 8px;}
  .sec-amt{margin-left:auto; font-variant-numeric:tabular-nums; font-size:14px;}
  .sec-body{padding-bottom:6px;}
  .card-head{display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:4px;}
  .card-head h3{margin:0;}
  .seg{display:inline-flex; background:var(--line); border-radius:100px; padding:3px; gap:2px;}
  .seg button{border:0; background:transparent; font-family:inherit; font-size:12.5px; font-weight:700; padding:5px 13px; border-radius:100px; color:var(--ink-2); cursor:pointer;}
  .seg button.on{background:var(--card); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12);}
  table.repart{width:100%; min-width:0; table-layout:fixed; border-collapse:collapse; font-size:14px; margin-top:6px;}
  table.repart th.c-m{width:86px;} table.repart th.c-p{width:62px;} table.repart th.c-c{width:52px;}


  table.repart tr.rp-grp td{font-weight:800; padding-top:10px;}

  table.repart tr.rp-sub td{border-top:0; padding-top:1px; padding-bottom:5px; font-size:12.5px; color:var(--ink-2);}
  table.repart{font-size:13.5px;}
  table.repart tr.rp-sub td:first-child{padding-left:22px;}


  table.repart .rp-cible{font-size:12.5px; font-weight:800; color:var(--ink-2);}

  table.repart th.c-p, table.repart th.c-m{white-space:normal;}
  table.repart th{font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-muted); font-weight:700; padding:4px 6px; text-align:left;}
  table.repart td{padding:8px 6px; border-top:1px solid var(--line); border-bottom:0; vertical-align:middle;}
  table.repart .num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap;}
  table.repart tr.rp-rev td{font-weight:700;}
  table.repart tr.rp-tot td{font-weight:800; border-top:2px solid var(--border);}
  table.repart tr.rp-reste td{font-weight:800;}
  .rp-bar{height:4px; border-radius:100px; background:var(--line); margin-top:4px; margin-left:auto; width:64px; overflow:hidden;}
  .rp-bar i{display:block; height:100%; border-radius:100px;}
  .solde-det summary{cursor:pointer; color:var(--accent); font-weight:600; font-size:12.5px; padding:4px 0;}
  .solde-det .wallet-row{display:flex; justify-content:space-between; align-items:center; color:var(--ink-2); padding:3px 0; font-variant-numeric:tabular-nums;}
  .solde-det .wallet-row b{color:var(--ink);} .solde-det .wallet-row b.pos{color:var(--good);}
  .solde-det .wallet-row.total{border-top:1px solid var(--line); margin-top:3px; padding-top:6px; font-weight:700; color:var(--ink);}
  .checklist{display:flex; flex-direction:column; gap:6px;}
  .chk-row{display:flex; align-items:center; gap:10px; padding:8px 10px; border:1px solid var(--border); border-radius:10px; background:var(--surface); cursor:pointer;}
  .chk-row.done{background:var(--good-bg); border-color:transparent;}
  .chk-row.done .chk-lbl{color:var(--ink-2);}
  .chk{width:20px; height:20px; accent-color:var(--good); flex:0 0 auto; cursor:pointer; margin:0;}
  .chk-lbl{flex:1 1 auto; font-size:14px; font-weight:600; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .chk-prevu{font-size:13px; color:var(--ink-muted); font-variant-numeric:tabular-nums;}
  .chk-amt{width:96px; text-align:right; padding:4px 7px; font-size:13px;}
  .chk-inline{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--ink-2); cursor:pointer;}
  .reel-fixe{display:inline-flex; align-items:center; gap:6px; justify-content:flex-end;}
  .signed{display:inline-flex; align-items:center; gap:6px;}
  .sign-btn{padding:4px 10px; font-size:14px;}
  .sub-pct{font-size:12px; font-weight:700; margin-top:1px;}
  .info-line{font-size:12.5px; color:var(--ink-2); background:var(--surface); border:1px dashed var(--border); border-radius:10px; padding:8px 10px; margin-bottom:12px;}
  .num-missing{border-style:dashed; border-color:var(--warning);}
  .val-cell, .pv-cell{display:inline-flex; flex-direction:column; align-items:flex-end; gap:1px;}
  .val-cell em, .pv-cell em{font-style:normal; font-size:10.5px; color:var(--ink-muted); font-weight:600;}
  .pv-cell em{color:inherit;}
  .evo-wrap{overflow-x:auto;}
  .evo-svg{width:100%; height:auto; display:block; min-width:320px;}
  .reste-card{padding:16px 18px;}
  .reste-head{display:flex; justify-content:space-between; align-items:flex-end; gap:12px; flex-wrap:nowrap;}
  .reste-head > div:first-child{min-width:0;}
  .reste-jour{flex:0 0 auto;}
  .reste-val{font-size:28px; font-weight:800; letter-spacing:-0.02em; font-variant-numeric:tabular-nums; line-height:1.15;}
  .reste-jour{text-align:right; display:flex; flex-direction:column; align-items:flex-end; font-size:12px; color:var(--ink-2);}
  .reste-jour b{font-size:22px; font-weight:800; font-variant-numeric:tabular-nums;}
  .rythme{margin-top:12px;}
  .rythme-bar{position:relative; height:10px; border-radius:100px; background:var(--line); overflow:visible;}
  .rythme-bar i{display:block; height:100%; border-radius:100px;}
  .rythme-mark{position:absolute; top:-4px; width:2px; height:18px; background:var(--ink); border-radius:2px; transform:translateX(-1px);}
  .rythme-txt{font-size:12px; color:var(--ink-2); margin-top:7px; line-height:1.45;}
  .alertes{display:flex; flex-direction:column; gap:5px; margin-top:12px;}
  .alerte{font-size:12.5px; padding:7px 10px; border-radius:10px; background:var(--warning-bg); color:var(--ink);}
  .alerte.over{background:var(--critical-bg);}
  .toast{position:fixed; left:50%; bottom:calc(84px + env(safe-area-inset-bottom,0px)); transform:translate(-50%, 20px); opacity:0; pointer-events:none;
    max-width:min(92vw, 520px); background:var(--ink); color:var(--card); font-size:13.5px; padding:11px 15px; border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.18); transition:opacity .2s, transform .2s; z-index:40;}
  .toast.show{opacity:1; transform:translate(-50%, 0);}
  .favoris{display:flex; flex-wrap:wrap; gap:7px; align-items:center; margin-bottom:10px;}
  .fav-chip{display:inline-flex; align-items:center; border:1px solid var(--border); border-radius:100px; background:var(--card); overflow:hidden;}
  .fav-btn{border:none; background:transparent; padding:7px 12px; font-size:13px; font-weight:600; color:var(--ink); cursor:pointer; font-family:inherit;}
  .fav-btn:active{background:var(--fixe-bg);}
  .fav-del{border:none; border-left:1px solid var(--border); background:var(--critical-bg); color:var(--critical); padding:7px 10px; font-weight:700; cursor:pointer;}
  .fav-edit{border:none; background:transparent; color:var(--accent); font-size:12.5px; font-weight:600; cursor:pointer; padding:4px 6px; font-family:inherit;}
  .qa-actions{display:flex; gap:8px;}
  .dep-list{display:flex; flex-direction:column; gap:6px;}
  .dep{border:1px solid var(--border); border-radius:12px; background:var(--surface); overflow:hidden;}
  .dep.open{border-color:var(--accent);}
  .dep-line{display:flex; align-items:center; gap:10px; width:100%; border:0; background:transparent; padding:9px 12px; font-family:inherit; text-align:left; cursor:pointer; color:var(--ink);}
  .dep-date{flex:0 0 auto; font-size:12px; font-weight:700; color:var(--ink-muted); font-variant-numeric:tabular-nums;}
  .dep-lbl{flex:1 1 auto; min-width:0; font-size:14.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .dep-lbl em{display:block; font-style:normal; font-size:12px; font-weight:500; color:var(--ink-muted); overflow:hidden; text-overflow:ellipsis;}
  .dep-amt{flex:0 0 auto; font-size:15px; font-variant-numeric:tabular-nums;}
  .dep-amt.remb{color:var(--good);}
  .qa-sens{flex:1 1 100%;}
  .qa-sens .seg{width:100%; display:flex;} .qa-sens .seg button{flex:1 1 0;}
  #qaNature{padding:7px 10px; font-size:14px;}
  select.nat-bes{background:var(--fixe-bg); color:var(--fixe); border-color:transparent;}
  select.nat-env{background:#fdeef6; color:#b23c7c; border-color:transparent;}
  .dep-edit{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px; padding:4px 12px 12px;}
  .dep-edit .de-label, .dep-edit .de-act{grid-column:1 / -1;}
  .dep-edit .text-input, .dep-edit .num-input, .dep-edit select{width:100%; max-width:none; min-width:0;}
  .dep-edit .num-input{text-align:right;}
  .de-act{display:flex; justify-content:flex-end; align-items:center; gap:8px;}
  .pl-list{display:flex; flex-direction:column; gap:6px;}

    .qa-actions{width:100%;} .qa-actions .btn-primary{flex:2 1 auto;} .qa-actions .btn-ghost{flex:1 1 auto;}

(function(){

function download(name, data, type){
  var ext = String(name||'').split('.').pop().toLowerCase();
  var mime = type || ({pdf:'application/pdf', json:'application/json'}[ext]) || 'text/html';
  var blob = new Blob([data], {type: mime});
  function viaLien(){
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); }, 1500);
  }
  /* iPhone / iPad : la feuille de partage propose « Enregistrer dans Fichiers » */
  var ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  try{
    var f = new File([blob], name, {type: mime});
    if(ios && navigator.canShare && navigator.canShare({files:[f]})){
      return navigator.share({files:[f], title:name}).catch(function(e){ if(!e || e.name!=='AbortError') viaLien(); });
    }
  }catch(e){}
  viaLien();
}

  return Promise.reject(new Error('indisponible'));
} };

    '<div class="card" style="max-width:420px;margin:40px auto;">'+

    '<button class="btn btn-primary" type="submit" id="lgBtn">Se connecter</button></form>'+
    '<p class="hint-line" id="lgMsg" style="color:var(--critical);text-align:center;">'+esc(msg||'')+'</p>'+
    '<p class="hint-line" style="text-align:center;"><button type="button" class="link-btn" id="lgReset">Mot de passe oublié ?</button></p></div>';
  var f = document.getElementById('loginForm');
  f.onsubmit = function(ev){
    ev.preventDefault();
    var btn = document.getElementById('lgBtn'); btn.disabled = true; btn.textContent = 'Connexion…';
    auth.signInWithEmailAndPassword(document.getElementById('lgEmail').value.trim(), document.getElementById('lgPass').value)
      .catch(function(err){ btn.disabled = false; btn.textContent = 'Se connecter'; document.getElementById('lgMsg').textContent = MSG[err && err.code] || ('Connexion impossible ('+(err && err.code || 'erreur')+').'); });
  };
  document.getElementById('lgReset').onclick = function(){
    var em = document.getElementById('lgEmail').value.trim(), m = document.getElementById('lgMsg');
    if(!em){ m.textContent = 'Tapez d\'abord votre e-mail ci-dessus.'; return; }
    auth.sendPasswordResetEmail(em).then(function(){ m.style.color = 'var(--good)'; m.textContent = 'Un e-mail pour changer le mot de passe vient d\'être envoyé.'; })
      .catch(function(err){ m.textContent = MSG[err && err.code] || 'Envoi impossible.'; });
  };
}
var started = false;
function boot(){
  if(!ok){ appEl().innerHTML = '<div class="empty"><div class="em">⚠️</div><p>Impossible de charger Firebase.<br>Vérifiez votre connexion internet, puis rouvrez l\'appli.</p></div>'; return; }
  auth.onAuthStateChanged(function(u){
    window.__fbUser = u;
    if(!u){ if(started){ location.reload(); return; } showLogin(); return; }
    if(started) return;
    appEl().innerHTML = '<div class="empty"><div class="em">💶</div><p>Chargement de votre budget…</p></div>';
    /* vérifie l'accès (règles Firestore) avant de lancer l'appli */

      started = true; window.__startApp();
      /* outils PDF chargés d'avance : l'export devient instantané (utile pour le partage sur iPhone) */

    }).catch(function(err){

        showLogin('Ce compte n\'a pas accès aux données. Vérifiez que son e-mail est bien écrit dans les règles de Firestore.');
      } else { started = true; window.__startApp(); }
    });
  });
}

/* ----- import de la sauvegarde (premier lancement) ----- */
document.addEventListener('change', function(ev){
  if(!ev.target || ev.target.id!=='impFile' || !ev.target.files || !ev.target.files[0]) return;
  var msg = document.getElementById('impMsg');
  var r = new FileReader();
  r.onload = function(){
    var o;
    try{ o = JSON.parse(r.result); }catch(e){ o = null; }
    if(!o || !o.docs || !o.docs['config/main']){ msg.style.color = 'var(--critical)'; msg.textContent = 'Ce fichier n\'est pas une sauvegarde de l\'appli. Rien n\'a été modifié.'; return; }
    var paths = Object.keys(o.docs).filter(function(p){ return /^[A-Za-z0-9_-]+\/[A-Za-z0-9_.~:@+-]+$/.test(p); });
    msg.style.color = ''; msg.textContent = 'Import en cours… (' + paths.length + ' éléments)';
    var chunks = [];
    for(var i=0; i<paths.length; i+=400) chunks.push(paths.slice(i, i+400));
    var p = Promise.resolve();
    chunks.forEach(function(ch){
      p = p.then(function(){ var b = fdb.batch(); ch.forEach(function(path){ b.set(fdb.doc(path), o.docs[path]); }); return b.commit(); });
    });
    p.then(function(){ msg.style.color = 'var(--good)'; msg.textContent = '✅ ' + paths.length + ' éléments importés.'; setTimeout(function(){ location.reload(); }, 800); })
     .catch(function(err){ msg.style.color = 'var(--critical)'; msg.textContent = 'L\'import a échoué (' + (err && err.code || 'erreur') + '). Réessayez.'; });
  };
  r.readAsText(ev.target.files[0]);
});

/* ----- carte Compte : sauvegarde + déconnexion ----- */
document.addEventListener('click', function(ev){

      .then(function(){
        var d = new Date(), nom = 'Budget - sauvegarde '+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+'.json';
        download(nom, JSON.stringify({app:'budget-clair', exportedAt:d.toISOString(), docs:docs}), 'application/json');
        if(m) m.textContent = '';
      }).catch(function(){ if(m) m.textContent = 'Sauvegarde impossible (connexion ?).'; });
  }
});

<script>
/* ============ Budget Clair — version page web (Firebase) ============ */

var MOIS_FR = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function defaultMonthLabel(){
  var d = new Date();
  var s = MOIS_FR[d.getMonth()]+' '+d.getFullYear();
  return s.charAt(0).toUpperCase()+s.slice(1);
}

/* ---------- listes de choix ---------- */
var SOURCES = [
  {id:'salaire',       label:'💼 Salaire'},
  {id:'chomage',       label:'🏛️ Chômage'},
  {id:'caf',           label:'👶 CAF'},
  {id:'remboursement', label:'💊 Remboursement'},
  {id:'autre',         label:'✨ Autre'}
];
var MODES_REVENU = [
  {id:'compte',  label:'🏦 Compte'},
  {id:'especes', label:'💵 Espèces'}
];

/* Épargne = argent mis de côté sans risque (livrets). Investissement = argent
   placé dont la valeur monte ou descend (bourse, crypto…). */
var KINDS = [
  {id:'livretA',  label:'🏦 Livret A',             cat:'epargne'},
  {id:'lep',      label:'🏦 LEP',                  cat:'epargne'},
  {id:'autre',    label:'🐷 Autre',        cat:'epargne'},
  {id:'bourse',   label:'📈 Bourse',               cat:'invest'},
  {id:'crypto',   label:'🪙 Crypto',               cat:'invest'},
  {id:'autreInv', label:'📊 Autre', cat:'invest'}
];
/* Les types (Livret A, LEP, Bourse…) : ceux de départ, puis ceux que vous créez ou renommez. */
function typesAll(){ var d = state.data; return (d && Array.isArray(d.types) && d.types.length) ? d.types : KINDS; }
function ensureTypes(){ var d = state.data; if(!Array.isArray(d.types) || !d.types.length) d.types = KINDS.map(function(k){ return {id:k.id, label:k.label, cat:k.cat}; }); return d.types; }
function catOf(e){ var k = typesAll().find(function(x){ return x.id===e.kind; }); return k ? k.cat : (KINDS.some(function(x){ return x.id===e.kind && x.cat==='invest'; }) ? 'invest' : 'epargne'); }
function kindOptions(sel, cat){
  var T = typesAll().filter(function(k){ return !cat || k.cat===cat; });
  return T.map(function(k){ return '<option value="'+k.id+'" '+(sel===k.id?'selected':'')+'>'+escHtml(k.label||'(sans nom)')+'</option>'; }).join('')+
         (cat ? '<option value="__new__">➕ Nouveau type…</option>' : '');
}
/* Placements de départ : soldes vides (null) tant que vous ne les donnez pas —
   aucun montant n'est inventé. */
function defaultEpargnes(){
  return [ {id:'e1', kind:'livretA', label:'Livret A', plateforme:'', debut:null, versements:[], finOverride:null} ];
}
function seedData(){
  return {
    monthLabel: defaultMonthLabel(),
    epargnes: defaultEpargnes(),
    revenus: [ {id:'r1', label:'Salaire', source:'salaire', mode:'compte', budget:0, reel:0} ],
    lignes: [
      {id:'l1', label:'🏠 Loyer', type:'fixe', paiement:'carte', budget:0, reel:0},
      {id:'l2', label:'⚡ Électricité', type:'fixe', paiement:'carte', budget:0, reel:0},
      {id:'l6', label:'🛒 Courses', type:'variable', paiement:'carte', budget:0, reel:0},
      {id:'l9', label:'🎉 Loisirs', type:'variable', paiement:'carte', budget:0, reel:0, dispensable:true},
      {id:'l10', label:'📦 Autre', type:'variable', paiement:'carte', budget:0, reel:0},
      {id:'l11', label:'💰 Épargne', type:'epargne', paiement:'carte', budget:0, reel:0}
    ]

}

var state = {
  db: null,
  ready: false,
  exists: false,
  data: null,
  filter: 'all',       /* all | fixe | variable */
  payFilter: 'all',    /* all | carte | especes */
  sortMode: 'type',    /* type | libre | reel | budget | nom */
  tab: 'saisie',       /* saisie | bilan */
  posteOrder: null,
  draft: null,         /* saisie rapide d'une dépense */
  draftVersement: null,/* saisie rapide d'un versement */
  history: [],
  confirmClose: false,
  armedDelete: null,
  dirty: {},
  gen: 0,
  writing: false,
  writeAgain: false,
  needsRender: false,
  transfert: null,
  dl: null,
  favEdit: false,
  soldeDetOpen: false,
  pointerActive: false,
  saveTimer: null,
  lastLocalEdit: 0
};

/* ================= SYNCHRONISATION =================
   Deux personnes, deux téléphones, un ordinateur : chacun peut écrire en même
   temps. Pour qu'aucun appareil n'écrase ce qu'un autre vient de faire :
   - chaque dépense et chaque versement est un document séparé (ajouter ou
     supprimer une ligne ne réécrit jamais la liste entière) ;
   - le reste (revenus, postes, placements…) n'est réécrit que champ par champ,
     uniquement pour ce qui a été modifié sur cet appareil ;
   - les mises à jour venues d'ailleurs sont toujours appliquées, jamais ignorées. */
var CONFIG_FIELDS = ['monthLabel','moisCle','revenus','lignes','epargnes','report','favoris','prochain','types'];

function inputFocused(){
  var a = document.activeElement;
  return !!(a && a.closest && a.closest('#app') && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
}
/* Redessine tout de suite, ou dès que l'utilisateur a fini son geste en cours.
   Redessiner la page entre le moment où le doigt touche un bouton et celui où il
   se relève remplace le bouton sous le doigt : le toucher est alors perdu (c'est
   ce qui rendait parfois la corbeille « sans effet »). */
function requestRender(){
  if(!state.ready) return;
  if(inputFocused() || state.pointerActive){ state.needsRender = true; return; }
  state.needsRender = false;
  render();
}
function flushDeferredRender(){
  if(state.needsRender && !inputFocused() && !state.pointerActive){ state.needsRender = false; render(); }
}
function isEditing(){ return inputFocused(); }
function scheduleHistRender(){ requestRender(); }

/* ---------- une collection synchronisée (dépenses, versements) ---------- */
function CollSync(name, prefix){
  this.name = name; this.prefix = prefix;
  this.docs = []; this.key = null; this.unsub = null;
  this.pending = {};   /* ajoutés ici, pas encore confirmés par le serveur */
  this.deleted = {};   /* supprimés ici, pas encore disparus côté serveur */
  this.patch = {};     /* modifications locales en attente d'écriture */
  this.timers = {};
}
CollSync.prototype.ref = function(id){ return state.db.collection(this.name).doc(id); };
CollSync.prototype.subscribe = function(key, force){
  if(!force && key===this.key) return;
  var self = this;
  if(this.unsub){ try{ this.unsub(); }catch(e){} this.unsub = null; }
  if(this.key!==key){ this.docs = []; }
  this.key = key;
  this.unsub = state.db.collection(this.name).where('mois','==',key).onSnapshot(function(qs){
    var map = {};
    qs.docs.forEach(function(d){ var o = JSON.parse(JSON.stringify(d.data())); o.id = d.id; map[d.id] = o; });
    Object.keys(self.deleted).forEach(function(id){ if(map[id]) delete map[id]; else delete self.deleted[id]; });
    Object.keys(self.pending).forEach(function(id){
      if(map[id]) delete self.pending[id];
      else { var loc = self.find(id); if(loc) map[id] = loc; }
    });
    Object.keys(self.patch).forEach(function(id){ var loc = self.find(id); if(loc && map[id]) map[id] = loc; });
    self.docs = Object.keys(map).map(function(k){ return map[k]; });
    attachDerived();
    requestRender();
  }, function(err){ console.error(self.name, err); });
};
CollSync.prototype.find = function(id){ return this.docs.find(function(d){ return d.id===id; }); };
CollSync.prototype.clean = function(o){ var c = {}; Object.keys(o).forEach(function(k){ if(k!=='id') c[k]=o[k]; }); return c; };
CollSync.prototype.add = function(obj){
  var self = this;
  obj.id = newId(this.prefix);
  obj.mois = this.key;
  this.docs.push(obj);
  this.pending[obj.id] = true;
  this.ref(obj.id).set(this.clean(obj)).catch(function(err){ console.error('add '+self.name, err); });
  attachDerived();
  return obj;
};
CollSync.prototype.edit = function(id, field, value, immediate){
  var self = this, o = this.find(id);
  if(!o) return;
  o[field] = value;
  this.patch[id] = this.patch[id] || {};
  this.patch[id][field] = value;
  clearTimeout(this.timers[id]);
  var flush = function(){
    var p = self.patch[id]; if(!p) return;
    delete self.patch[id];
    self.ref(id).update(p).catch(function(err){ console.error('edit '+self.name, err); });
  };
  if(immediate) flush(); else this.timers[id] = setTimeout(flush, 500);
  attachDerived();
};
CollSync.prototype.remove = function(id){
  clearTimeout(this.timers[id]); delete this.patch[id]; delete this.pending[id];
  this.docs = this.docs.filter(function(d){ return d.id!==id; });
  this.deleted[id] = true;
  this.ref(id).delete().catch(function(err){ console.error('del', err); });
  attachDerived();
};

var deps = new CollSync('depenses','a');
var vers = new CollSync('versements','v');
/* retraits au distributeur / dépôts d'espèces : ni dépense ni revenu, juste
   de l'argent qui change de poche */
var trans = new CollSync('transferts','t');

/* Les listes du mois sont rangées dans state.data pour que tout le reste du
   code (totaux, Pareto, clôture) les lise comme avant. */
function attachDerived(){
  if(!state.data) return;
  state.data.achats = deps.docs;
  (state.data.epargnes||[]).forEach(function(e){
    e.versements = vers.docs.filter(function(v){ return v.epId===e.id; });
  });
}
function ensureMonthSubscriptions(force){
  if(!state.data) return;
  deps.subscribe(state.data.moisCle, force);
  vers.subscribe(state.data.moisCle, force);
  trans.subscribe(state.data.moisCle, force);
}

async function initDb(){
  try{ state.db = await claude.use('db'); }catch(e){ state.db = null; }
  if(!state.db){
    document.getElementById('app').innerHTML = '<div class="empty"><div class="em">⚠️</div><p>Impossible de joindre la base de données.<br>Vérifiez votre connexion internet, puis rouvrez l\'appli.</p></div>';
    return;
  }
  claude.use('downloads').then(function(dl){ state.dl = dl; requestRender(); }).catch(function(){ state.dl = null; });
  state.db.collection('mois').orderBy('id','desc').limit(60).onSnapshot(function(qs){
    state.history = qs.docs.map(function(x){ var o=JSON.parse(JSON.stringify(x.data())); o._id=x.id; return o; });
    requestRender();
  }, function(err){ console.error('mois', err); });

  state.db.doc('config/main').onSnapshot(applyConfigSnapshot, function(err){ console.error('config', err); });

  /* Téléphone remis en route : on relit tout avant la moindre saisie. */
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState==='visible') refreshFromServer();
  });
  document.addEventListener('focusout', function(){ setTimeout(flushDeferredRender, 0); });
  var pointerTimer = null;
  document.addEventListener('pointerdown', function(){
    state.pointerActive = true;
    clearTimeout(pointerTimer);
    pointerTimer = setTimeout(function(){ state.pointerActive = false; flushDeferredRender(); }, 900);
  }, true);
  document.addEventListener('click', function(){
    clearTimeout(pointerTimer);
    state.pointerActive = false;
    setTimeout(flushDeferredRender, 0);
  });
}
function applyConfigSnapshot(snap){
  if(!snap.exists){ state.data = null; state.exists = false; state.ready = true; render(); return; }
  var incoming = normalizeData(JSON.parse(JSON.stringify(snap.data())));
  if(!state.data){ state.data = incoming; }
  else {
    CONFIG_FIELDS.forEach(function(f){ if(!state.dirty[f]) state.data[f] = incoming[f]; });
  }
  state.exists = true; state.ready = true;
  ensureMonthSubscriptions();
  attachDerived();
  requestRender();
}
function refreshFromServer(){
  if(!state.db) return;
  state.db.doc('config/main').get().then(applyConfigSnapshot).catch(function(){});
  ensureMonthSubscriptions(true);
}
function normalizeData(d){
  d = d || {};
  if(!Array.isArray(d.revenus)){
    /* ancien format : un seul "Revenu net" */
    var old = d.revenu || {budget:0, reel:0};
    d.revenus = [{id:'r1', label:'Revenu net', source:'autre', mode:'compte', budget:+old.budget||0, reel:+old.reel||0}];
  }
  d.revenus.forEach(function(r){
    r.source = r.source||'autre'; r.mode = r.mode||'compte';
    if(typeof r.recu!=='boolean') r.recu = (+r.reel||0)>0;
  });
  d.lignes = Array.isArray(d.lignes) ? d.lignes : [];
  d.lignes.forEach(function(l){
    if(l.type==='fixe' || !l.paiement) l.paiement = (l.type==='fixe') ? 'carte' : (l.paiement||'carte');
    if(l.type==='fixe' && typeof l.paye!=='boolean') l.paye = (+l.reel||0)>0;
  });
  if(!Array.isArray(d.epargnes)) d.epargnes = defaultEpargnes();
  d.epargnes.forEach(function(e){
    if(!Array.isArray(e.versements)){
      e.versements = [];
      if(isSet(e.verse) && +e.verse!==0) e.versements.push({id:'v1', date: todayISO(), montant:+e.verse, source:'compte'});
    }
    if(e.finOverride===undefined) e.finOverride = isSet(e.fin) ? +e.fin : null;
    delete e.verse; delete e.fin;
  });
  /* l'ancien poste « Épargne » devient un type à part entière */
  if(!d.lignes.some(function(l){ return l.type==='epargne'; })){
    var old = d.lignes.find(function(l){ return l.label && l.label.indexOf('Épargne')>-1; });
    if(old) old.type = 'epargne';
  }
  d.report = d.report || {compte:0, especes:0};
  d.monthLabel = d.monthLabel || defaultMonthLabel();
  d.moisCle = d.moisCle || monthKeyFromLabel(d.monthLabel);
  d.favoris = Array.isArray(d.favoris) ? d.favoris : [];
  d.prochain = (d.prochain && typeof d.prochain==='object') ? d.prochain : {};
  delete d.achats;   /* les dépenses vivent maintenant dans leur propre collection */
  d.achats = [];
  return d;
}

function seedIfEmpty(){ state.db.doc('config/main').set(seedData()); }

/* Identifiant unique, jamais réutilisé : avec un simple compteur, supprimer une
   ligne puis en créer une autre redonnait le même identifiant — une dépense
   pouvait alors hériter d'une confirmation de suppression restée en mémoire, ou
   se rattacher à un poste supprimé. */
var idSeq = 0;
function newId(prefix){
  idSeq++;
  return prefix + Date.now().toString(36) + idSeq.toString(36) + Math.floor(Math.random()*1296).toString(36);
}
function nextId(list, prefix){ return newId(prefix); }
function nextVersementId(){ return newId('v'); }

function persist(immediate, fields){
  fields = fields || ['monthLabel','revenus','lignes','epargnes','report'];
  state.gen = (state.gen||0) + 1;
  fields.forEach(function(f){ state.dirty[f] = state.gen; });
  state.lastLocalEdit = Date.now();
  if(state.saveTimer) clearTimeout(state.saveTimer);
  state.saveTimer = null;
  if(immediate) flushConfig(); else state.saveTimer = setTimeout(flushConfig, 500);
}
function stripVersements(E){
  return (E||[]).map(function(e){ var c = {}; Object.keys(e).forEach(function(k){ if(k!=='versements') c[k]=e[k]; }); return c; });
}
/* Une seule écriture à la fois ; ce qui change pendant l'écriture repart juste après. */
function flushConfig(){
  state.saveTimer = null;
  if(state.writing){ state.writeAgain = true; return; }
  var fields = Object.keys(state.dirty);
  if(!fields.length) return;
  var g = state.gen, payload = { updatedAt: new Date().toISOString() };
  fields.forEach(function(f){ payload[f] = (f==='epargnes') ? stripVersements(state.data.epargnes) : state.data[f]; });
  state.writing = true;
  state.db.doc('config/main').update(payload).then(function(){
    fields.forEach(function(f){ if(state.dirty[f]<=g) delete state.dirty[f]; });
  }).catch(function(err){ console.error('save', err); }).then(function(){
    state.writing = false;
    if(state.writeAgain || Object.keys(state.dirty).some(function(f){ return state.dirty[f]>g; })){
      state.writeAgain = false; flushConfig();
    }
  });
}

function eur(n){ n = n||0; return n.toLocaleString('fr-FR',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2}); }
function eur0(n){ n = n||0; return n.toLocaleString('fr-FR',{style:'currency',currency:'EUR',minimumFractionDigits:0,maximumFractionDigits:0}); }
function pct(n){ return Math.round((n||0)*100)+'%'; }
function escapeAttr(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }
function numStr(n){ n=+n||0; return String(Math.round(n*100)/100).replace('.',','); }
function parseAmount(v){ v=String(v||'').replace(/\s|€/g,'').replace(',','.'); var n=parseFloat(v); return isNaN(n)?0:n; }
function numStrOrEmpty(n){ return (n==null || n==='') ? '' : numStr(n); }
function parseAmountOrNull(v){ v=String(v||'').trim(); if(!v) return null; return parseAmount(v); }
function isSet(n){ return n!=null && n!=='' && !isNaN(+n); }
/* ---------- épargne ---------- */
/* Versés du mois : plusieurs versements possibles par placement (le 1er, le 10…). */
function epVerse(e){ return (e.versements||[]).reduce(function(s,v){ return s+(+v.montant||0); },0); }
/* Solde de fin = solde de début + versements du mois, sauf si vous saisissez
   vous-même la valeur réelle (utile en bourse ou en crypto, où ça fluctue). */
function epFin(e){
  /* valeur saisie à la main + ce qui a été versé depuis cette saisie */
  if(isSet(e.finOverride)) return +e.finOverride + (epVerse(e) - (+e.verseAuMoment||0));
  if(isSet(e.debut)) return +e.debut + epVerse(e);
  var v = epVerse(e);
  return v ? v : null;
}
function epGain(e){ return (isSet(e.finOverride) && isSet(e.debut)) ? (epFin(e) - +e.debut - epVerse(e)) : null; }
/* Total investi = tout l'argent que vous y avez mis depuis le début (versements
   du mois compris). C'est la base pour savoir si un placement a pris ou perdu de
   la valeur : 5 000 € investis qui en valent 15 000 € = +10 000 € (+200 %). */
function epInvesti(e){ return isSet(e.investi) ? (+e.investi + epVerse(e)) : null; }
/* Investissements : on ne suit que le total investi. S'il n'a jamais été saisi,
   on reprend le montant déjà enregistré pour ce placement (début + versements). */
function investTotal(e){ var i = epInvesti(e); return i!=null ? i : epFin(e); }
function investSum(){
  return state.data.epargnes.filter(function(e){ return catOf(e)==='invest'; })
    .reduce(function(s,e){ var v = investTotal(e); return s + (v!=null ? v : 0); }, 0);
}
function epPV(e){
  var v = epFin(e), i = epInvesti(e);
  if(v==null || i==null) return null;
  return {eur: v - i, pct: i>0 ? (v - i)/i : null};
}
function epTotals(cat){
  var E = state.data.epargnes.filter(function(e){ return !cat || catOf(e)===cat; }), t = {total:0, verse:0, gain:0, hasTotal:false, hasGain:false, anyVerse:false, nbVersements:0,
    investi:0, valeurSuivie:0, pv:0, hasPV:false, nbSansInvesti:0, versePlus:0, retire:0, nbRetraits:0};
  E.forEach(function(e){
    var v = epFin(e); if(v!=null){ t.total += v; t.hasTotal = true; }
    var ve = epVerse(e); t.verse += ve;
    (e.versements||[]).forEach(function(v){ var m = +v.montant||0; if(m<0){ t.retire += -m; t.nbRetraits++; } else { t.versePlus += m; t.nbVersements++; } });
    if(ve!==0) t.anyVerse = true;
    var g = epGain(e); if(g!=null){ t.gain += g; t.hasGain = true; }
    var pv = epPV(e);
    if(pv){ t.investi += epInvesti(e); t.valeurSuivie += v; t.pv += pv.eur; t.hasPV = true; }
    else if(v!=null && v>0) t.nbSansInvesti++;
  });
  t.pvPct = t.investi>0 ? t.pv/t.investi : null;
  return t;
}
function frDateCourt(iso){ var m = String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3]+'/'+m[2]+'/'+m[1].slice(2) : ''; }
function pctStr(x){ return (x>=0?'+':'')+(Math.round(x*1000)/10).toString().replace('.',',')+' %'; }
/* D'où sort l'argent versé : compte chèque ou espèces. */
function verseDepuis(source){
  return state.data.epargnes.reduce(function(s,e){
    return s + (e.versements||[]).filter(function(v){ return (v.source||'compte')===source; }).reduce(function(a,v){ return a+(+v.montant||0); },0);
  },0);
}
function sign(n){ return (n>=0?'+':'')+eur(n); }

/* ---------- achats du mois ----------
   Un « poste » porte le prévisionnel (ex. Alimentation 500 €). Un « achat » est
   une dépense réelle (ex. Leclerc 47,20 €) rattachée à un poste. Le réel d'un
   poste variable est donc la somme de ses achats, jamais une saisie directe. */
function achatsDu(posteId){ return state.data.achats.filter(function(a){ return (a.posteId||'')===(posteId||''); }); }
function sumAchats(posteId){ return achatsDu(posteId).reduce(function(s,a){ return s+(+a.montant||0); },0); }
function epargneLine(){ return state.data.lignes.find(function(l){ return l.type==='epargne'; }); }
function investLine(){ return state.data.lignes.find(function(l){ return l.type==='invest'; }); }
/* le premier poste de chaque type reprend automatiquement les versements du mois */
function isAutoEpargne(l){
  var ref = l.type==='invest' ? investLine() : epargneLine();
  return !!(ref && l.id===ref.id);
}
/* Réel d'un poste : saisi pour les dépenses fixes, calculé pour les variables. */
function reelOf(l){
  if(!l) return 0;
  if(l.type==='fixe') return +l.reel||0;
  if(l.type==='epargne') return isAutoEpargne(l) ? epTotals('epargne').verse : (+l.reel||0);
  if(l.type==='invest') return isAutoEpargne(l) ? epTotals('invest').verse : (+l.reel||0);
  return sumAchats(l.id);
}
/* Besoin ou envie : choisi sur la dépense, sinon celui de son poste. */
function natureDe(a){
  if(a.nature==='besoin' || a.nature==='envie') return a.nature;
  var l = a.posteId && state.data.lignes.find(function(x){ return x.id===a.posteId; });
  return (l && l.dispensable) ? 'envie' : 'besoin';
}
function natureDuPoste(posteId){
  var l = posteId && state.data.lignes.find(function(x){ return x.id===posteId; });
  return (l && l.dispensable) ? 'envie' : 'besoin';
}
function achatsHorsPoste(){
  var vars = state.data.lignes.filter(function(l){ return l.type==='variable'; }).map(function(l){ return l.id; });
  return state.data.achats.filter(function(a){ return !a.posteId || vars.indexOf(a.posteId)<0; });
}
function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function frDate(iso){
  var m = String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})/);
  return m ? (m[3]+'/'+m[2]) : '';
}

/* ---------- totaux ---------- */
function sumOf(list, field, pred){
  return list.filter(pred||function(){return true;}).reduce(function(s,x){ return s+(+x[field]||0); }, 0);
}
function totals(){
  var d = state.data;
  var t = {
    revB: sumOf(d.revenus,'budget'), revR: sumOf(d.revenus,'reel'),
    fixeB: sumOf(d.lignes,'budget',function(l){return l.type==='fixe';}),
    varB: sumOf(d.lignes,'budget',function(l){return l.type==='variable';}),
    epB: sumOf(d.lignes,'budget',function(l){return l.type==='epargne';}),
    fixeR: d.lignes.filter(function(l){return l.type==='fixe';}).reduce(function(s,l){ return s+reelOf(l); },0),
    varR: d.lignes.filter(function(l){return l.type==='variable';}).reduce(function(s,l){ return s+reelOf(l); },0),
    epR: d.lignes.filter(function(l){return l.type==='epargne';}).reduce(function(s,l){ return s+reelOf(l); },0),
    invB: sumOf(d.lignes,'budget',function(l){return l.type==='invest';}),
    invR: d.lignes.filter(function(l){return l.type==='invest';}).reduce(function(s,l){ return s+reelOf(l); },0),
    horsPoste: achatsHorsPoste().reduce(function(s,a){ return s+(+a.montant||0); },0),
    /* compte chèque vs espèces */
    revCompteR: sumOf(d.revenus,'reel',function(r){return r.mode!=='especes';}),
    revCashR:   sumOf(d.revenus,'reel',function(r){return r.mode==='especes';}),
    revCompteB: sumOf(d.revenus,'budget',function(r){return r.mode!=='especes';}),
    revCashB:   sumOf(d.revenus,'budget',function(r){return r.mode==='especes';}),
    carteR: d.lignes.filter(function(l){return l.type==='fixe';}).reduce(function(s,l){ return s+reelOf(l); },0)
          + sumOf(d.achats,'montant',function(a){ return a.paiement!=='especes'; })
          + verseDepuis('compte'),
    cashR:  sumOf(d.achats,'montant',function(a){ return a.paiement==='especes'; })
          + verseDepuis('especes')
  };
  /* Dépenses = ce qui est consommé. Épargne = ce qui sort du compte mais reste à vous.
     Sorties = les deux : c'est ce qui quitte réellement le compte ce mois-ci. */
  t.depR = t.fixeR + t.varR + t.horsPoste;
  /* fixes « dispensables » : abonnements qu'on pourrait résilier */
  var FD = d.lignes.filter(function(l){ return l.type==='fixe' && l.dispensable; });
  t.fixeDispB = sumOf(FD,'budget'); t.fixeDispR = FD.reduce(function(s,l){ return s+reelOf(l); },0);
  t.fixeIndB = t.fixeB - t.fixeDispB; t.fixeIndR = t.fixeR - t.fixeDispR;
  t.depB = t.fixeB + t.varB;
  t.sortiesR = t.depR + t.epR + t.invR;
  t.sortiesB = t.depB + t.epB + t.invB;
  t.reportCompte = +((state.data.report||{}).compte)||0;
  t.reportCash = +((state.data.report||{}).especes)||0;
  t.retraits = trans.docs.filter(function(x){ return x.sens!=='depot'; }).reduce(function(s2,x){ return s2+(+x.montant||0); },0);
  t.depots = trans.docs.filter(function(x){ return x.sens==='depot'; }).reduce(function(s2,x){ return s2+(+x.montant||0); },0);
  t.soldeCompte = t.reportCompte + t.revCompteR - t.carteR - t.retraits + t.depots;
  t.soldeCash = t.reportCash + t.revCashR - t.cashR + t.retraits - t.depots;
  t.resteB = t.revB-t.depB; t.resteR = t.revR-t.depR;
  return t;
}
function lineByLabel(txt){ return state.data.lignes.find(function(x){ return x.label && x.label.indexOf(txt)>-1; }); }

/* ---------- rendu ---------- */
/* Prélèvements cochés tout seuls : le jour noté est arrivé et ce n'est pas encore coché.
   Une seule fois par mois et par poste : si vous décochez à la main, l'appli ne recoche pas. */
function autoPrelevements(){
  var d = state.data; if(!d || !Array.isArray(d.lignes)) return;
  var j = joursRestants(); if(j.etat==='futur') return;
  var today = j.etat==='fini' ? 99 : new Date().getDate(), faits = [];
  d.lignes.forEach(function(l){
    if(l.type!=='fixe' || l.paye || !isSet(l.jour) || l.autoMois===d.moisCle) return;
    if(+l.jour > today) return;
    l.paye = true; l.reel = (+l.reel||0)>0 ? +l.reel : (+l.budget||0);
    l.autoMois = d.moisCle; l.autoCoche = true;
    faits.push(l.label);
  });
  if(faits.length){
    persist(true, ['lignes']);
    setTimeout(function(){ toast('✅ Prélevé'+(faits.length>1?'s':'')+' automatiquement : '+faits.map(escHtml).join(', '), 'good'); }, 50);
  }
}

/* ================= PAGE 1 — SAISIE ================= */
/* Jours restants dans le mois suivi (moisCle), aujourd'hui compris. */
function joursRestants(){
  var p = String(state.data.moisCle||'').split('-'), y = +p[0], m = +p[1];
  var now = new Date(), cy = now.getFullYear(), cm = now.getMonth()+1;
  var nbJours = new Date(y, m, 0).getDate();
  if(!y || !m) return {restants:nbJours, total:nbJours, ecoules:0, etat:'courant'};
  if(cy*12+cm > y*12+m) return {restants:0, total:nbJours, ecoules:nbJours, etat:'fini'};
  if(cy*12+cm < y*12+m) return {restants:nbJours, total:nbJours, ecoules:0, etat:'futur'};
  var d = now.getDate();
  return {restants: nbJours-d+1, total:nbJours, ecoules: d-1, etat:'courant'};
}
/* Postes variables : ce qui est consommé par rapport au prévu. */
function etatPostesVariables(){
  return state.data.lignes.filter(function(l){ return l.type==='variable' && (+l.budget||0)>0; }).map(function(l){
    var r = reelOf(l), b = +l.budget||0;
    return {l:l, reel:r, budget:b, ratio: b>0 ? r/b : 0, reste: b-r};
  });
}
function resteCard(){
  var t = totals(), j = joursRestants();
  var horsPoste = t.horsPoste||0;
  var reste = t.varB - t.varR - horsPoste;
  var parJour = j.restants>0 ? reste/j.restants : null;
  var col = reste<0 ? 'var(--critical)' : (t.varB>0 && reste < t.varB*0.15 ? 'var(--warning)' : 'var(--good)');
  var h = '<div class="card reste-card">';
  h += '<div class="reste-head"><div><div class="solde-lbl">🎯 Il vous reste pour les dépenses variables</div>'+
       '<div class="reste-val" style="color:'+col+';">'+eur(reste)+'</div></div>';
  if(j.etat==='courant' && parJour!=null){
    h += '<div class="reste-jour"><b style="color:'+col+';">'+(reste>0?eur0(Math.floor(parJour)):'0 €')+'</b><span>par jour · '+j.restants+' j restant'+(j.restants>1?'s':'')+'</span></div>';
  } else if(j.etat==='fini'){
    h += '<div class="reste-jour"><span>Mois terminé :<br>pensez à le clôturer</span></div>';
  }
  h += '</div>';
  /* rythme : part du budget consommée vs part du mois écoulée */
  if(j.etat==='courant' && t.varB>0){
    var pBudget = Math.min(1.5, (t.varR+horsPoste)/t.varB), pMois = j.ecoules/j.total;
    h += '<div class="rythme"><div class="rythme-bar"><i style="width:'+Math.min(100,Math.round(pBudget*100))+'%; background:'+col+';"></i><span class="rythme-mark" style="left:'+Math.round(pMois*100)+'%;" title="Aujourd\'hui"></span></div>'+
         '<div class="rythme-txt">'+Math.round(pBudget*100)+' % du budget variable dépensé, '+Math.round(pMois*100)+' % du mois écoulé'+
         (pBudget > pMois+0.1 ? ' — <b style="color:var(--warning);">vous allez plus vite que prévu</b>' : (pBudget < pMois-0.1 ? ' — <b style="color:var(--good);">vous êtes en avance sur le budget</b>' : ' — dans le rythme'))+'</div></div>';
  }
  /* alertes : postes à 80 % ou plus */
  var alertes = etatPostesVariables().filter(function(x){ return x.ratio>=0.8; }).sort(function(a,b){ return b.ratio-a.ratio; });
  if(alertes.length){
    h += '<div class="alertes">'+alertes.map(function(x){
      var over = x.ratio>1;
      return '<div class="alerte '+(over?'over':'')+'">'+(over?'🔴':'🟠')+' <b>'+escHtml(x.l.label)+'</b> : '+eur(x.reel)+' sur '+eur0(x.budget)+
        (over ? ' — dépassé de '+eur(-x.reste) : ' — reste '+eur(x.reste))+'</div>';
    }).join('')+'</div>';
  }
  if(horsPoste) h += '<div class="hint-line" style="margin-top:6px;">Dont '+eur(horsPoste)+' de dépenses sans poste, déduites du reste.</div>';
  h += '</div>';
  return h;
}
/* Message éphémère en bas de l'écran (au-dessus des onglets). */
var toastTimer = null;
function toast(html, kind){
  var el = document.getElementById('toast');
  if(!el){ el = document.createElement('div'); el.id = 'toast'; document.body.appendChild(el); }
  el.className = 'toast show '+(kind||'');
  el.innerHTML = html;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.className = 'toast '+(kind||''); }, 5000);
}
/* Après une nouvelle dépense : prévenir si le poste franchit 80 % ou 100 %. */
function alerteApresAjout(posteId, montant){
  var l = state.data.lignes.find(function(x){ return x.id===posteId; });
  if(!l || l.type!=='variable' || !(+l.budget>0)) return;
  var apres = reelOf(l), avant = apres - montant, b = +l.budget;
  if(apres > b && avant <= b) toast('🔴 <b>'+escHtml(l.label)+'</b> dépasse son budget : '+eur(apres)+' sur '+eur0(b)+' (+'+eur(apres-b)+')', 'bad');
  else if(apres >= 0.8*b && avant < 0.8*b) toast('🟠 <b>'+escHtml(l.label)+'</b> : '+Math.round(apres/b*100)+' % du budget utilisé — reste '+eur(b-apres), 'warn');
  else if(apres > b) toast('🔴 <b>'+escHtml(l.label)+'</b> : '+eur(apres)+' sur '+eur0(b), 'bad');
}

/* Transforme une carte « <div class="card"><h3>titre</h3>contenu</div> » en carte repliable :
   on ne voit que le titre et le total ; la flèche déroule le contenu. */
function plier(id, cardHtml, droite){
  var i = cardHtml.indexOf('<h3>'), j = cardHtml.indexOf('</h3>');
  if(i<0 || j<0) return cardHtml;
  var titre = cardHtml.slice(i+4, j);
  var corps = cardHtml.slice(j+5).replace(/<\/div>\s*$/, '');
  return '<div class="card card-fold">'+sec('b-'+id, false, '<span class="fold-t">'+titre+'</span><span class="sec-amt">'+(droite||'')+'</span>', '<div class="fold-body">'+corps+'</div>')+'</div>';
}

/* ---------- préparer le prévisionnel du mois suivant ----------
   Les montants sont rangés sous la clé du mois (ex. « 2026-11 ») et appliqués
   au moment de la clôture du mois en cours. */
function planProchain(create){
  var d = state.data, nk = nextKey(d.moisCle);
  d.prochain = d.prochain || {};
  if(!d.prochain[nk] && create) d.prochain[nk] = {lignes:{}, revenus:{}};
  var p = d.prochain[nk];
  if(p){ p.lignes = p.lignes || {}; p.revenus = p.revenus || {}; }
  return p || null;
}
function planVal(kind, item){
  var p = planProchain(false);
  var v = p && p[kind] && p[kind][item.id];
  return isSet(v) ? +v : (+item.budget||0);
}
function prochainCard(){
  var d = state.data, nk = nextKey(d.moisCle), moisN = labelFromKey(nk), moisC = labelFromKey(d.moisCle).split(' ')[0];
  var p = planProchain(false);
  function aDesValeurs(o){ return Object.keys(o||{}).some(function(k){ return isSet(o[k]); }); }
  var modifie = !!(p && (aDesValeurs(p.lignes) || aDesValeurs(p.revenus)));
  function row(kind, it){
    var v = planVal(kind, it), cur = +it.budget||0, diff = Math.round((v-cur)*100)/100;
    return '<div class="pn-row"><span class="pn-lbl">'+escHtml(it.label||'(sans nom)')+
      (diff ? '<em>'+moisC+' : '+eur0(cur)+' · <b style="color:'+((kind==='revenus') === (diff>0) ? 'var(--good)' : 'var(--critical)')+';">'+(diff>0?'+':'−')+eur0(Math.abs(diff))+'</b></em>' : '')+'</span>'+
      '<input type="text" inputmode="decimal" autocomplete="off" class="num-input" data-pn="'+kind+':'+it.id+'" value="'+numStr(v)+'"></div>';
  }
  var L = d.lignes;
  var groupes = [
    {t:'🏠 Fixes', f:function(l){ return l.type==='fixe'; }},
    {t:'🛒 Variables', f:function(l){ return l.type==='variable'; }},
    {t:'🐷 Épargne et investissement', f:function(l){ return l.type==='epargne' || l.type==='invest'; }}
  ];
  /* totaux et règle 50/30/20 */
  var rev = d.revenus.reduce(function(s,r){ return s+planVal('revenus', r); },0);
  var bes = 0, env = 0, epa = 0;
  L.forEach(function(l){ var v = planVal('lignes', l); if(l.type==='epargne' || l.type==='invest') epa += v; else if(l.dispensable) env += v; else bes += v; });
  var sorties = bes+env+epa, reste = rev - sorties;
  function pc(v){ return rev>0 ? Math.round(v/rev*100)+' %' : '—'; }
  var h = '<div class="card"><h3>🔜 Prévisionnel de '+escHtml(moisN)+' '+aideBtn('prochain')+'</h3>';
  h += aideTxt('prochain', 'Préparez les montants du mois prochain sans toucher à '+escHtml(moisC)+'. Ils remplaceront le prévisionnel au moment où vous clôturerez '+escHtml(moisC)+'. Par défaut, ce sont les montants de '+escHtml(moisC)+'. Besoin d\'un nouveau poste ? Créez-le dans « '+escHtml(moisC)+' (en cours) » avec 0 €, puis donnez-lui son montant ici.');
  h += '<div class="pn-sum"><div><span>Revenus prévus</span><b>'+eur(rev)+'</b></div><div><span>Sorties prévues</span><b>'+eur(sorties)+'</b></div>'+
       '<div><span>'+(reste>=0?'Il reste':'Il manque')+'</span><b style="color:'+(reste>=0?'var(--good)':'var(--critical)')+';">'+eur(Math.abs(reste))+'</b></div></div>';
  h += '<div class="pn-regle"><span>🏠 Besoins <b style="color:'+(rev>0&&bes/rev<=0.5?'var(--good)':'var(--critical)')+';">'+pc(bes)+'</b> <i>/ 50 %</i></span><span>🎉 Envies <b style="color:'+(rev>0&&env/rev<=0.3?'var(--good)':'var(--critical)')+';">'+pc(env)+'</b> <i>/ 30 %</i></span><span>🐷 Épargne <b style="color:'+(rev>0&&epa/rev>=0.2?'var(--good)':'var(--warning)')+';">'+pc(epa)+'</b> <i>/ 20 %</i></span></div>';
  h += '<div class="pn-grp"><div class="pn-t">💶 Revenus</div>'+d.revenus.map(function(r){ return row('revenus', r); }).join('')+'</div>';
  groupes.forEach(function(g){
    var items = L.filter(g.f); if(!items.length) return;
    h += '<div class="pn-grp"><div class="pn-t">'+g.t+'</div>'+items.map(function(l){ return row('lignes', l); }).join('')+'</div>';
  });
  if(modifie) h += '<button class="add-row-btn" id="pnReset">↺ Reprendre les montants de '+escHtml(moisC)+'</button>';
  h += '</div>';
  return h;
}

/* ---------- poste proposé quand on tape le nom d'une dépense ---------- */
function normLib(t){ return String(t||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z ]+/g,' ').replace(/\s+/g,' ').trim(); }
function suggestionPoste(label){
  var n = normLib(label); if(n.length<3) return null;
  var mot = n.split(' ')[0];
  var vars = {}; state.data.lignes.forEach(function(l){ if(l.type==='variable') vars[l.id] = true; });
  var exact = {}, debut = {};
  function compte(a){
    if(!a || !a.posteId || !vars[a.posteId] || (+a.montant||0)<0) return;
    var m = normLib(a.label); if(!m) return;
    if(m===n) exact[a.posteId] = (exact[a.posteId]||0)+1;
    else if(m.indexOf(n)>-1 || (mot.length>=4 && m.split(' ').indexOf(mot)>-1)) debut[a.posteId] = (debut[a.posteId]||0)+1;
  }
  (state.data.achats||[]).forEach(compte);
  (state.history||[]).forEach(function(m){ ((m.snapshot||{}).achats||[]).forEach(compte); });
  function meilleur(o){ var best = null, bn = 0; Object.keys(o).forEach(function(k){ if(o[k]>bn){ bn = o[k]; best = k; } }); return best; }
  return meilleur(exact) || meilleur(debut);
}

/* ---------- aide : une icône « i » qui déplie l'explication ---------- */
function aideBtn(k){ return '<button type="button" class="i-btn'+(state.aide===k?' on':'')+'" data-aide="'+k+'" aria-label="Aide" title="Aide">i</button>'; }
function aideTxt(k, html){ return state.aide===k ? '<div class="aide-txt">'+html+'</div>' : ''; }

/* ---------- sections repliables : on garde en mémoire ce que vous ouvrez/fermez ---------- */
function secOpen(id, def){ return (state.sec && Object.prototype.hasOwnProperty.call(state.sec, id)) ? !!state.sec[id] : !!def; }
function sec(id, def, summary, body, cls){

}
function seg(key, opts, cur){

}

/* ---------- carte principale : le compte + ce qu'il reste à dépenser ---------- */
function compteCard(t){
  var av = aVenir(), j = joursRestants();
  var finMois = t.soldeCompte - av.prelev + av.revCompte;
  var col = t.soldeCompte>=0 ? 'var(--good)' : 'var(--critical)';
  var hp = t.horsPoste||0, reste = t.varB - t.varR - hp;
  var parJour = j.restants>0 ? reste/j.restants : null;
  var colR = reste<0 ? 'var(--critical)' : (t.varB>0 && reste < t.varB*0.15 ? 'var(--warning)' : 'var(--good)');
  var h = '<div class="card solde-card">';
  h += '<div class="solde-top"><div><div class="solde-lbl">🏦 Sur le compte chèque</div>'+
       '<div class="solde-val" style="color:'+col+';">'+eur(t.soldeCompte)+'</div></div>'+
       '<div class="solde-cash"><div class="solde-lbl">💵 Espèces</div><div class="solde-val2">'+eur(t.soldeCash)+'</div></div></div>';
  /* deux fins de mois : sans nouvelle dépense, et en dépensant tout le budget prévu */
  var resteAPrevoir = Math.max(0, t.varB - t.varR - (t.horsPoste||0)) + Math.max(0, t.epB - t.epR) + Math.max(0, t.invB - t.invR);
  var finTout = finMois - resteAPrevoir;
  h += '<div class="proj2">'+
       '<div><span>Fin de mois si plus aucune dépense</span><b style="color:'+(finMois>=0?'var(--good)':'var(--critical)')+';">'+eur(finMois)+'</b></div>'+
       '<div><span>Fin de mois si tout le budget prévu est dépensé</span><b style="color:'+(finTout>=0?'var(--good)':'var(--critical)')+';">'+eur(finTout)+'</b></div>'+
       '</div>';
  if(av.prelev||av.revCompte||resteAPrevoir) h += '<div class="proj-line"><span>Compte déjà : '+(av.prelev?'−'+eur0(av.prelev)+' de prélèvements à venir':'')+(av.prelev&&av.revCompte?', ':'')+(av.revCompte?'+'+eur0(av.revCompte)+' de revenus attendus':'')+
       (resteAPrevoir?((av.prelev||av.revCompte)?' ; ':'')+'le 2ᵉ chiffre retire aussi '+eur0(resteAPrevoir)+' encore prévus (variables, épargne)':'')+'.</span></div>';
  /* prélèvements de la semaine (jour noté dans « À cocher ») */
  if(j.etat==='courant'){
    var today = new Date().getDate();
    var Fx = state.data.lignes.filter(function(l){ return l.type==='fixe' && !l.paye && isSet(l.jour); });
    var semaine = Fx.filter(function(l){ return +l.jour>=today && +l.jour<=today+7; }).sort(function(a,b){ return a.jour-b.jour; });
    var retard = Fx.filter(function(l){ return +l.jour<today; }).sort(function(a,b){ return a.jour-b.jour; });
    if(semaine.length) h += '<div class="semaine">📅 Cette semaine : '+semaine.map(function(l){ return escHtml(l.label)+' <i>le '+(+l.jour)+'</i>'; }).join(' · ')+' — <b>'+eur(semaine.reduce(function(s2,l){ return s2+(+l.budget||0); },0))+'</b></div>';
    if(retard.length) h += '<div class="semaine retard">⏰ Pas encore coché : '+retard.map(function(l){ return escHtml(l.label)+' <i>le '+(+l.jour)+'</i>'; }).join(' · ')+'</div>';
  }

  h += '<div class="reste-bloc"><div class="reste-head"><div><div class="solde-lbl">🎯 Reste pour les dépenses variables</div>'+
       '<div class="reste-val" style="color:'+colR+';">'+eur(reste)+'</div></div>';
  if(j.etat==='courant' && parJour!=null) h += '<div class="reste-jour"><b style="color:'+colR+';">'+(reste>0?eur0(Math.floor(parJour)):'0 €')+'</b><span>par jour · '+j.restants+' j</span></div>';
  else if(j.etat==='fini') h += '<div class="reste-jour"><span>Mois terminé :<br>pensez à le clôturer</span></div>';
  h += '</div>';
  if(j.etat==='courant' && t.varB>0){
    var pB = Math.min(1.5, (t.varR+hp)/t.varB), pM = j.ecoules/j.total;
    h += '<div class="rythme"><div class="rythme-bar"><i style="width:'+Math.min(100,Math.round(pB*100))+'%; background:'+colR+';"></i><span class="rythme-mark" style="left:'+Math.round(pM*100)+'%;" title="Aujourd\'hui"></span></div>'+
         '<div class="rythme-txt">'+Math.round(pB*100)+' % dépensé · '+Math.round(pM*100)+' % du mois'+
         (pB > pM+0.1 ? ' — <b style="color:var(--warning);">plus vite que prévu</b>' : (pB < pM-0.1 ? ' — <b style="color:var(--good);">en avance</b>' : ' — dans le rythme'))+'</div></div>';
  }
  var alertes = etatPostesVariables().filter(function(x){ return x.ratio>=0.8; }).sort(function(a,b){ return b.ratio-a.ratio; });
  if(alertes.length){
    h += '<div class="alertes">'+alertes.map(function(x){
      var over = x.ratio>1;
      return '<div class="alerte '+(over?'over':'')+'">'+(over?'🔴':'🟠')+' <b>'+escHtml(x.l.label)+'</b> : '+eur(x.reel)+' / '+eur0(x.budget)+'</div>';
    }).join('')+'</div>';
  }
  if(hp) h += '<div class="hint-line" style="margin-top:6px;">Dont '+eur(hp)+' de dépenses sans poste.</div>';
  h += '</div>';

  var besoin = -finMois;
  if(finMois>=0 && finTout<0) h += '<div class="deficit-hint" style="background:var(--surface);border:1px dashed var(--warning);"><span>⚠️ Si vous dépensez tout le budget prévu, il manquera environ '+eur(-finTout)+' en fin de mois.</span></div>';  /* seulement si la fin de mois estimée est négative : un découvert passager avant les salaires ne compte pas */
  if(besoin > 0.005 && state.data.epargnes.some(function(e){ return catOf(e)==='epargne'; })){
    var prop = Math.ceil(besoin/10)*10;
    h += '<div class="deficit-hint"><span>⚠️ Il manquera environ '+eur(-finMois)+' en fin de mois.</span>'+
         '<button type="button" class="btn-mini" data-puiser="'+prop+'">🐷 Puiser '+eur0(prop)+' dans l\'épargne</button></div>';
  }
  h += '<div class="solde-actions">';
  var retireMois = epTotals('epargne').retire;
  h += sec('puiser', !!state.puiser, '🐷 Puiser dans l\'épargne'+(retireMois>0 ? ' <span class="muted">· '+eur(retireMois)+' ce mois</span>' : ''), puiserBloc(t), 'solde-det');
  h += sec('especes', !!state.transfert, '🏧 Retrait / dépôt d\'espèces', transfertBloc(t), 'solde-det');
  h += soldeDetail(t);
  h += '</div></div>';
  return h;
}

/* ---------- épargne -> compte chèque : un versement négatif sur le livret ---------- */
function puiserBloc(t){
  var E = state.data.epargnes.filter(function(e){ return catOf(e)==='epargne'; });
  if(!E.length) return '<p class="hint-line">Ajoutez d\'abord un livret dans l\'onglet Budget.</p>';
  var pz = state.puiser || {montant:'', epId:'', date:todayISO()};
  var ep = E.find(function(e){ return e.id===pz.epId; }) || E.slice().sort(function(a,b){ return (epFin(b)||0)-(epFin(a)||0); })[0];
  var solde = epFin(ep)||0, m = parseAmount(pz.montant);
  var h = '<div class="transfert">';
  h += '<p class="pareto-sub" style="margin:0 0 8px;">Quand vous virez de l\'argent d\'un livret vers le compte chèque. Le livret baisse, le compte monte.</p>';
  h += '<div class="tf-form" style="margin-top:0;">';
  h += '<select class="chip-select" id="pEp">'+E.map(function(e){ return '<option value="'+e.id+'" '+(e.id===ep.id?'selected':'')+'>'+escHtml(e.label||'(sans nom)')+' · '+eur0(epFin(e)||0)+'</option>'; }).join('')+'</select>';
  h += '<div class="tf-row"><input type="text" inputmode="decimal" autocomplete="off" class="num-input" id="pMontant" value="'+escapeAttr(pz.montant)+'" placeholder="Montant">'+

/* ---------- où va l'argent : prévu, réel et cible (règle 50/30/20) ---------- */
var CIBLES = {besoins:{max:0.5, txt:'≤ 50 %'}, envies:{max:0.3, txt:'≤ 30 %'}, epargne:{min:0.2, txt:'≥ 20 %'}};
function repartitionCard(){
  var t = totals(), d = state.data, j = joursRestants();
  function somme(pred, reel){ return d.lignes.filter(pred).reduce(function(s,l){ return s + (reel ? reelOf(l) : (+l.budget||0)); },0); }
  function ligne(lbl, pred, extraR){ return {lbl:lbl, b:somme(pred,false), r:somme(pred,true)+(extraR||0)}; }
  /* variables : prévu selon le poste, réel selon la nature de chaque dépense */
  function varLigne(nat){
    var b = d.lignes.filter(function(l){ return l.type==='variable' && (nat==='envie') === !!l.dispensable; }).reduce(function(s,l){ return s+(+l.budget||0); },0);
    var r = (d.achats||[]).filter(function(a){
      var l = a.posteId && d.lignes.find(function(x){ return x.id===a.posteId; });
      return !(l && l.type==='fixe') && natureDe(a)===nat;
    }).reduce(function(s,a){ return s+(+a.montant||0); },0);
    return {lbl:'Variables', b:b, r:r};
  }
  var G = [
    {id:'besoins', lbl:'🏠 Besoins', rows:[
      ligne('Fixes', function(l){ return l.type==='fixe' && !l.dispensable; }),
      varLigne('besoin')]},
    {id:'envies', lbl:'🎉 Envies', rows:[
      ligne('Fixes', function(l){ return l.type==='fixe' && l.dispensable; }),
      varLigne('envie')]},
    {id:'epargne', lbl:'🐷 Épargne', rows:[
      ligne('Épargne', function(l){ return l.type==='epargne'; }),
      ligne('Investissement', function(l){ return l.type==='invest'; })]}
  ];
  G.forEach(function(g){ g.b = g.rows.reduce(function(s,r){ return s+r.b; },0); g.r = g.rows.reduce(function(s,r){ return s+r.r; },0); });
  var reel = state.repMode==='reel';
  var revB = t.revB, revR = t.revR;
  var sortB = G.reduce(function(s,g){ return s+g.b; },0), sortR = G.reduce(function(s,g){ return s+g.r; },0);
  function pc(v, rev){ return rev>0 ? Math.round(v/rev*100)+' %' : '—'; }
  function col(g, v, rev){
    if(!(rev>0)) return '';
    var x = v/rev, c = CIBLES[g.id];
    if(c.max!=null) return x<=c.max ? 'var(--good)' : 'var(--critical)';
    return x>=c.min ? 'var(--good)' : 'var(--warning)';
  }
  function cell(v, rev, color){ return '<td class="num"><b>'+eur0(v)+'</b><em'+(color?' style="color:'+color+';"':'')+'>'+pc(v,rev)+'</em></td>'; }
  var rev = reel ? revR : revB;
  function v(x){ return reel ? x.r : x.b; }
  var h = '<div class="card"><div class="card-head"><h3>📊 Où va l\'argent '+aideBtn('repart')+'</h3>'+seg('repMode',[['prevu','Prévu'],['reel','Réel']], reel?'reel':'prevu')+'</div>';
  h += aideTxt('repart', (reel ? 'Ce qui est déjà reçu et dépensé'+(j.etat==='courant' ? ' à ce jour (le mois n\'est pas fini).' : ' ce mois-ci.') : 'Votre budget prévu, rapporté à vos revenus prévus.')+' La cible suit la règle 50/30/20 : 50 % pour les besoins, 30 % pour les envies, 20 % pour l\'épargne.');
  h += '<table class="repart"><thead><tr><th></th><th class="num c-m">Montant</th><th class="num c-p">% revenus</th><th class="num c-c">Cible</th></tr></thead><tbody>';
  h += '<tr class="rp-rev"><td>💶 Revenus'+(reel?' reçus':' prévus')+'</td><td class="num">'+eur(rev)+'</td><td class="num">'+(rev>0?'100 %':'—')+'</td><td></td></tr>';
  G.forEach(function(g){
    var c = col(g, v(g), rev);
    h += '<tr class="rp-grp"><td>'+g.lbl+'</td><td class="num">'+eur(v(g))+'</td><td class="num" style="'+(c?'color:'+c+';':'')+'">'+pc(v(g),rev)+'</td><td class="num rp-cible">'+CIBLES[g.id].txt+'</td></tr>';
    g.rows.forEach(function(r){
      if(!r.b && !r.r) return;
      h += '<tr class="rp-sub"><td>'+r.lbl+'</td><td class="num">'+eur(v(r))+'</td><td class="num">'+pc(v(r),rev)+'</td><td></td></tr>';
    });
  });
  var sorties = reel ? sortR : sortB, reste = rev - sorties;
  h += '<tr class="rp-tot"><td>Total des sorties</td><td class="num">'+eur(sorties)+'</td><td class="num">'+pc(sorties,rev)+'</td><td class="num rp-cible">100 %</td></tr>';
  h += '<tr class="rp-reste" style="color:'+(reste>=0?'var(--good)':'var(--critical)')+';"><td>'+(reste>=0?'✅ Il reste':'⚠️ Il manque')+'</td><td class="num">'+eur(Math.abs(reste))+'</td><td class="num">'+pc(Math.abs(reste),rev)+'</td><td></td></tr>';
  h += '</tbody></table>';
  if(!d.lignes.some(function(l){ return l.dispensable; })) h += '<p class="hint-line">Pour remplir la ligne « Envies », touchez « 🏠 Besoin » sur les postes concernés dans l\'onglet Budget pour les passer en « 🎉 Envie ».</p>';
  h += '</div>';
  return h;
}

/* ---------- postes de dépenses ----------
   L'ordre est figé pendant une saisie : sans ça, une ligne pouvait sauter de
   place au milieu d'une frappe, ce qui donnait l'impression d'un tri cassé. */
function postesRows(list){
  var a = document.activeElement;
  var editing = !!(a && a.closest && a.closest('#postesTable'));
  if(editing && state.posteOrder){
    var pos = {}; state.posteOrder.forEach(function(id,i){ pos[id]=i; });
    return list.slice().sort(function(x,y){ return (pos[x.id]==null?9999:pos[x.id]) - (pos[y.id]==null?9999:pos[y.id]); });
  }
  var sorted = sortRows(list);
  state.posteOrder = sorted.map(function(l){ return l.id; });
  return sorted;
}

  var vars = state.data.lignes.filter(function(l){ return l.type==='variable'; });

  var h = selected ? '' : '<option value="" selected disabled>'+(placeholder||'Choisir un poste')+'</option>';

/* ---------- courbe : valeur vs investi, mois après mois ---------- */
var MOIS_COURT = ['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
function moisCourt(k){ var p = String(k).split('-'); return MOIS_COURT[(+p[1])-1]+' '+String(p[0]).slice(2); }
function evolutionPoints(){
  var E = state.data.epargnes.filter(function(e){ return catOf(e)==='invest'; }), byMois = {};
  E.forEach(function(e){
    (e.histo||[]).forEach(function(p){
      var b = byMois[p.mois] = byMois[p.mois] || {mois:p.mois, valeur:0, investi:0, n:0, nInv:0};
      if(isSet(p.valeur) && +p.valeur!==0){ b.valeur += +p.valeur; b.n++; if(isSet(p.investi)){ b.investi += +p.investi; b.nInv++; } }
    });
  });
  /* la ligne « investi » n'a de sens que si on la connaît pour TOUS les placements,
     sinon l'écart avec la valeur serait faussé */
  var pts = Object.keys(byMois).sort().map(function(k){ var b = byMois[k]; b.hasInv = b.n>0 && b.nInv===b.n; return b; });
  /* le mois en cours, avec les valeurs du moment */
  var et = epTotals('invest');
  if(et.hasTotal){
    var cur = {mois: state.data.moisCle, valeur: et.total, investi: 0, n:0, nInv:0, enCours:true};
    E.forEach(function(e){ var v = epFin(e), i = epInvesti(e); if(v!=null && v!==0){ cur.n++; if(i!=null){ cur.investi += i; cur.nInv++; } } });
    cur.hasInv = cur.n>0 && cur.nInv===cur.n;
    pts = pts.filter(function(p){ return p.mois!==cur.mois; });
    pts.push(cur);
  }
  return pts;
}
function evolutionCard(){
  var pts = evolutionPoints();
  var h = '<div class="card"><h3>📈 Évolution de vos investissements</h3>';
  if(pts.length<2){
    h += '<p class="hint-line" style="margin-top:0;">La courbe se construit d\'elle-même : à chaque clôture de mois, la valeur de vos placements et le total investi sont enregistrés. Après la clôture d\'octobre, vous verrez un premier trait.</p></div>';
    return h;
  }
  var W = 640, H = 220, padL = 52, padR = 12, padT = 14, padB = 30;
  var max = Math.max.apply(null, pts.map(function(p){ return Math.max(p.valeur, p.investi); }));
  var min = Math.min.apply(null, pts.map(function(p){ return Math.min(p.valeur, p.hasInv?p.investi:p.valeur); }));
  var pad = (max-min)*0.1 || max*0.1 || 1; max += pad; min = Math.max(0, min-pad);
  var x = function(i){ return padL + (W-padL-padR) * (pts.length===1?0.5:i/(pts.length-1)); };
  var y = function(v){ return padT + (H-padT-padB) * (1 - (v-min)/(max-min)); };
  var svg = '<svg viewBox="0 0 '+W+' '+H+'" class="evo-svg" role="img" aria-label="Évolution de la valeur des placements">';
  for(var g=0; g<=4; g++){
    var gv = min + (max-min)*g/4;
    svg += '<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+y(gv)+'" y2="'+y(gv)+'" stroke="var(--line)"/>';
    svg += '<text x="'+(padL-6)+'" y="'+(y(gv)+4)+'" text-anchor="end" font-size="10.5" fill="var(--ink-muted)">'+eur0(gv)+'</text>';
  }
  var inv = pts.filter(function(p){ return p.hasInv; });
  if(inv.length>1) svg += '<polyline fill="none" stroke="var(--ink-muted)" stroke-width="2" stroke-dasharray="5 4" points="'+pts.map(function(p,i){ return p.hasInv ? x(i)+','+y(p.investi) : null; }).filter(Boolean).join(' ')+'"/>';
  svg += '<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" points="'+pts.map(function(p,i){ return x(i)+','+y(p.valeur); }).join(' ')+'"/>';
  pts.forEach(function(p,i){
    svg += '<circle cx="'+x(i)+'" cy="'+y(p.valeur)+'" r="3.5" fill="var(--card)" stroke="var(--accent)" stroke-width="2"><title>'+labelFromKey(p.mois)+' : '+eur(p.valeur)+(p.hasInv?' (investi '+eur(p.investi)+')':'')+(p.enCours?' — en cours':'')+'</title></circle>';
    var show = pts.length<=8 || i===0 || i===pts.length-1 || i%Math.ceil(pts.length/6)===0;
    var anchor = (i===0 && pts.length>1) ? 'start' : (i===pts.length-1 && pts.length>1 ? 'end' : 'middle');
    if(show) svg += '<text x="'+x(i)+'" y="'+(H-8)+'" text-anchor="'+anchor+'" font-size="10.5" fill="var(--ink-2)">'+moisCourt(p.mois)+'</text>';
  });
  svg += '</svg>';
  h += '<div class="pareto-legend"><span><i class="ln" style="background:var(--accent);"></i>Valeur</span><span><i class="dash" style="border-top-color:var(--ink-muted);"></i>Total investi</span></div>';
  h += '<div class="evo-wrap">'+svg+'</div>';
  if(!pts[pts.length-1].hasInv) h += '<p class="hint-line">La ligne « total investi » apparaîtra quand chaque placement aura son total investi renseigné.</p>';
  h += '</div>';
  return h;
}
